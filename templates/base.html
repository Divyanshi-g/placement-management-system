<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body class="min-h-screen flex flex-col
             bg-gradient-to-br
             from-indigo-900
             via-purple-900
             to-yellow-700
             text-slate-900">

<!-- ================= NAVBAR ================= -->
<nav class="fixed top-0 w-full z-50
            bg-white/60 backdrop-blur-md border-b border-white/40">

  <div class="max-w-7xl mx-auto px-6 py-3
              flex items-center justify-between">

    <!-- Logo -->
    <div class="group flex items-center gap-3 cursor-pointer">

      <div class="w-11 h-11 rounded-full
                  bg-gradient-to-br from-indigo-600 to-purple-600
                  text-white font-bold text-xl
                  flex items-center justify-center
                  transition-all duration-500
                  group-hover:rotate-180">
        H
      </div>

      <span class="max-w-0 overflow-hidden
                   group-hover:max-w-xs
                   transition-all duration-500
                   text-xl font-extrabold text-indigo-900">
        HireHub
      </span>
    </div>

    <!-- NAV OPTIONS (hidden on login/register) -->
    {% if show_nav %}
    <div class="flex items-center gap-6 text-sm font-semibold text-slate-800">
      <a href="#" class="px-3 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
        Home
      </a>
      <a href="#" class="px-3 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
        About
      </a>
      <a href="#" class="px-3 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
        Rate
      </a>
      <a href="#" class="px-3 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
        Settings
      </a>
    </div>
    {% endif %}

  </div>
</nav>

<!-- ================= BACK BUTTON ================= -->
<div class="max-w-7xl mx-auto px-6 pt-20">
  <button onclick="history.back()"
          class="inline-flex items-center gap-2
                 px-4 py-2
                 border-2 border-slate-800
                 rounded-lg
                 text-slate-900 font-medium
                 transition-all duration-200
                 hover:bg-slate-900 hover:text-white">
    ← Back
  </button>
</div>

<!-- ================= MAIN CONTENT ================= -->
<main class="flex-1">
  {% block content %}{% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer class="mt-16 border-t border-black/20">

  <div class="max-w-7xl mx-auto px-6 py-6
              flex flex-col md:flex-row
              items-center justify-between gap-4">

    <!-- Text -->
    <p class="text-black font-medium text-sm">
      © 2025 HireHub · Placement Management System
    </p>

    <!-- Social Icons -->
    <div class="flex gap-5 text-lg text-black">
      <a href="#" class="hover:text-indigo-800 transition">
        <i class="fab fa-whatsapp"></i>
      </a>
      <a href="#" class="hover:text-indigo-800 transition">
        <i class="fab fa-facebook"></i>
      </a>
      <a href="#" class="hover:text-indigo-800 transition">
        <i class="fab fa-linkedin"></i>
      </a>
    </div>

  </div>
</footer>

</body>
</html>
