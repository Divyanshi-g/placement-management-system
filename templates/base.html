<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Google Font: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .hidden-panel { display: none; }
    .eye-icon { cursor: pointer; }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-emerald-50 text-gray-900">

  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50 bg-emerald-100/80 backdrop-blur-md border-b border-emerald-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">

      <!-- Logo -->
      <div class="group flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-full
                    bg-teal-600 text-white font-bold
                    flex items-center justify-center
                    transition-transform group-hover:scale-105">
          H
        </div>
        <span class="text-3xl font-extrabold text-teal-600
                     transition-colors group-hover:text-teal-700">
          HireHub
        </span>
      </div>

      {% if show_nav_options %}
      <div class="hidden md:flex items-center gap-6 text-m font-medium text-emerald-600 relative">

        <a href="{{ home_url }}" class="px-2 py-1 border-b-2 border-transparent hover:border-teal-600 transition">Home</a>
        <a href="/about" class="px-2 py-1 border-b-2 border-transparent hover:border-teal-600 transition">About</a>
        <a href="/rate" class="px-2 py-1 border-b-2 border-transparent hover:border-teal-600 transition">Rate</a>

        <!-- SETTINGS DROPDOWN -->
        <div class="relative">
          <button onclick="togglePanel('settingsPanel')"
                  class="px-2 py-1 border-b-2 border-transparent hover:border-teal-600 flex items-center gap-1">
            <i class="fa-solid fa-gear"></i> Settings
          </button>

          <!-- SETTINGS PANEL -->
          <div id="settingsPanel"
               onclick="event.stopPropagation()"
               class="hidden-panel absolute right-0 mt-3 w-64 bg-teal-100 rounded-xl shadow-xl z-50 overflow-hidden">

            <!-- CHANGE PASSWORD STEP 1 -->
            <div id="stepOldPassword" class="px-4 py-3 border-b border-teal-200">
              <label class="block text-sm font-medium mb-1">Old Password</label>
              <div class="relative">
                <input type="password" id="oldPassword" class="w-full border rounded px-3 py-2 pr-10" placeholder="Enter old password">
                <i class="fa-solid fa-eye eye-icon absolute right-3 top-2.5 text-gray-500"
                   onclick="togglePassword('oldPassword', this)"></i>
              </div>
              <button onclick="verifyOldPassword()"
                      class="mt-3 w-full px-3 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">
                Change Password
              </button>
              <p class="text-sm text-red-600 mt-1 hidden" id="oldPasswordError">Old password incorrect</p>
              <a href="#" class="text-sm text-emerald-600 mt-2 inline-block" onclick="showForgotPassword()">Forgot password?</a>
            </div>

            <!-- FORGOT PASSWORD -->
            <div id="forgotPassword" class="hidden-panel px-4 py-3 border-b border-teal-200">
              <label class="block text-sm font-medium mb-1">Email</label>
              <input type="email" id="forgotEmail" class="w-full border rounded px-3 py-2" placeholder="Enter your registered email">
              <button onclick="sendOTP()" class="mt-2 w-full px-3 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">Send OTP</button>
              <p class="text-sm text-red-600 mt-1 hidden" id="forgotEmailError">Email not found</p>
            </div>

            <!-- OTP STEP -->
            <div id="otpStep" class="hidden-panel px-4 py-3 border-b border-teal-200">
              <label class="block text-sm font-medium mb-1">Enter OTP</label>
              <input type="text" id="otpInput" class="w-full border rounded px-3 py-2" placeholder="Enter OTP">
              <div class="flex justify-between mt-1 text-sm">
                <span id="otpTimer">05:00</span>
                <span id="otpAttempts">3 attempts left</span>
              </div>
              <button onclick="verifyOTP()" class="mt-2 w-full px-3 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">Verify OTP</button>
              <p class="text-sm text-red-600 mt-1 hidden" id="otpError">OTP incorrect or expired</p>
            </div>

            <!-- NEW PASSWORD STEP -->
            <div id="stepNewPassword" class="hidden-panel px-4 py-3">
              <label class="block text-sm font-medium mb-1">New Password</label>
              <div class="relative">
                <input type="password" id="newPassword" class="w-full border rounded px-3 py-2 pr-10" placeholder="Enter new password">
                <i class="fa-solid fa-eye eye-icon absolute right-3 top-2.5 text-gray-500"
                   onclick="togglePassword('newPassword', this)"></i>
              </div>

              <label class="block text-sm font-medium mt-3 mb-1">Confirm Password</label>
              <div class="relative">
                <input type="password" id="confirmPassword" class="w-full border rounded px-3 py-2 pr-10" placeholder="Confirm new password">
                <i class="fa-solid fa-eye eye-icon absolute right-3 top-2.5 text-gray-500"
                   onclick="togglePassword('confirmPassword', this)"></i>
              </div>

              <button onclick="submitNewPassword()"
                      class="mt-3 w-full px-3 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">
                Submit
              </button>
              <p class="text-sm text-red-600 mt-1 hidden" id="newPasswordError"></p>
              <p class="text-sm text-green-600 mt-1 hidden" id="newPasswordSuccess"></p>
            </div>

            <!-- THEME TOGGLE -->
            <div id="themeStep" class="hidden-panel px-4 py-3 border-t border-teal-200 flex items-center justify-between">
              <span>Dark Theme</span>
              <label class="inline-flex relative items-center cursor-pointer">
                <input type="checkbox" class="sr-only" id="themeSwitch">
                <div class="w-11 h-6 bg-emerald-200 rounded-full peer peer-checked:bg-teal-600 transition-all"></div>
                <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full peer-checked:translate-x-5 transition-all"></div>
              </label>
            </div>

          </div>
        </div>
      </div>

      <!-- MOBILE MENU BUTTON -->
      <button onclick="togglePanel('mobileMenu')" class="md:hidden text-teal-600 text-2xl">
        <i class="fa-solid fa-bars"></i>
      </button>
      {% endif %}
    </div>

    <!-- MOBILE MENU -->
    <div id="mobileMenu" class="hidden-panel md:hidden bg-teal-100/80 backdrop-blur-md shadow-lg">
      <div class="flex flex-col px-6 py-4 gap-4 text-teal-600 font-medium">
        <a href="{{ home_url }}">Home</a>
        <a href="/about">About</a>
        <a href="/rate">Rate</a>
        <button onclick="togglePanel('settingsPanel')">Settings</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl mx-auto px-6 mt-20">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-teal-100 text-teal-600 text-center py-6 mt-12 border-t border-teal-200">
    <div class="flex justify-center gap-6 mb-3 text-2xl">
      <a href="#" class="hover:bg-teal-200 transition"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" class="hover:bg-teal-200 transition"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="hover:bg-teal-200 transition"><i class="fa-brands fa-whatsapp"></i></a>
      <a href="#" class="hover:bg-teal-200 transition"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>
    © 2026 HireHub · Placement Management System
  </footer>




  <!-- SCRIPTS -->
  <script>
    let openPanel = null;

    function togglePanel(id) {
    const panel = document.getElementById(id);

    // Close previously open panel
    if (openPanel && openPanel !== id) {
      document.getElementById(openPanel).classList.add('hidden-panel');
    }

    // Toggle current panel
    panel.classList.toggle('hidden-panel');

    openPanel = panel.classList.contains('hidden-panel') ? null : id;
  }
    function togglePassword(fieldId, icon){
      const field = document.getElementById(fieldId);
      if(field.type === 'password'){
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // ----------------------
    // CHANGE PASSWORD LOGIC
    // ----------------------
    function verifyOldPassword(){
      const oldPwd = document.getElementById('oldPassword').value;
      // Make AJAX POST to /change-password-check or use fetch (old password validation)
      // For demonstration, using fake validation here
      if(oldPwd === "correctOldPassword"){ // replace with backend check
        document.getElementById('stepOldPassword').classList.add('hidden-panel');
        document.getElementById('stepNewPassword').classList.remove('hidden-panel');
      } else {
        document.getElementById('oldPasswordError').classList.remove('hidden');
      }
    }

    function showForgotPassword(){
      document.getElementById('stepOldPassword').classList.add('hidden-panel');
      document.getElementById('forgotPassword').classList.remove('hidden-panel');
    }

    function sendOTP(){
      // AJAX call to generate OTP and send email
      document.getElementById('forgotPassword').classList.add('hidden-panel');
      document.getElementById('otpStep').classList.remove('hidden-panel');
      startOTPTimer(300); // 5 minutes countdown
    }

    let otpTimeRemaining;
    let otpInterval;
    function startOTPTimer(seconds){
      otpTimeRemaining = seconds;
      const timerElem = document.getElementById('otpTimer');
      otpInterval = setInterval(()=>{
        const min = Math.floor(otpTimeRemaining/60).toString().padStart(2,'0');
        const sec = (otpTimeRemaining%60).toString().padStart(2,'0');
        timerElem.textContent = `${min}:${sec}`;
        otpTimeRemaining--;
        if(otpTimeRemaining<0){
          clearInterval(otpInterval);
          document.getElementById('otpError').textContent = "OTP expired";
          document.getElementById('otpError').classList.remove('hidden');
        }
      },1000);
    }

    function verifyOTP(){
      const otp = document.getElementById('otpInput').value;
      // AJAX check otp backend
      // For demo assuming otp = 123456
      if(otp === "123456"){ 
        document.getElementById('otpStep').classList.add('hidden-panel');
        document.getElementById('stepNewPassword').classList.remove('hidden-panel');
        clearInterval(otpInterval);
      } else {
        document.getElementById('otpError').classList.remove('hidden');
      }
    }

    function submitNewPassword(){
      const newPwd = document.getElementById('newPassword').value;
      const confirmPwd = document.getElementById('confirmPassword').value;
      const errorElem = document.getElementById('newPasswordError');
      const successElem = document.getElementById('newPasswordSuccess');

      const pwdRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      if(!pwdRegex.test(newPwd)){
        errorElem.textContent = "Password must be 8+ chars, 1 uppercase, 1 number, 1 special char";
        errorElem.classList.remove('hidden');
        successElem.classList.add('hidden');
        return;
      }
      if(newPwd !== confirmPwd){
        errorElem.textContent = "Passwords do not match";
        errorElem.classList.remove('hidden');
        successElem.classList.add('hidden');
        return;
      }

      // AJAX call to /change-password to save in backend
      successElem.textContent = "Password changed successfully!";
      successElem.classList.remove('hidden');
      errorElem.classList.add('hidden');
    }

    // Theme toggle
    const themeSwitch = document.getElementById('themeSwitch');
    if(themeSwitch){
      themeSwitch.addEventListener('change', function(){
        if(this.checked){
          document.body.classList.add('bg-gray-900','text-white');
        } else {
          document.body.classList.remove('bg-gray-900','text-white');
        }
        // AJAX POST to /toggle-theme to save in DB
      });
    }

    document.addEventListener('click', function (e) {
  if (!openPanel) return;

  const panel = document.getElementById(openPanel);
  const buttonClicked = e.target.closest('button');

  if (!panel.contains(e.target) && !buttonClicked) {
    panel.classList.add('hidden-panel');
    openPanel = null;
  }
});

  </script>
</body>
</html>
