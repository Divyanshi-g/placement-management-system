<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>

<body class="min-h-screen flex flex-col text-slate-900"
      style="
        background:
          radial-gradient(at 12% 18%, #4f7fd6 0px, transparent 52%),
          radial-gradient(at 82% 14%, #d85a9a 0px, transparent 52%),
          radial-gradient(at 88% 82%, #e0b014 0px, transparent 55%),
          radial-gradient(at 18% 82%, #2fbf9a 0px, transparent 52%),
          radial-gradient(at 50% 50%, #6d4bd6 0px, transparent 58%);
        background-color: #0b1220;
      ">

  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50 bg-white/45 backdrop-blur-xl shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">

      <!-- LOGO -->
      <div class="group flex items-center gap-3 cursor-pointer">

        <div class="w-10 h-10 rounded-full
                    bg-gradient-to-br from-purple-700 to-indigo-700
                    text-white font-bold flex items-center justify-center
                    transition-all duration-500
                    group-hover:scale-110">
          H
        </div>

        <span class="max-w-0 overflow-hidden whitespace-nowrap
                     text-2xl font-extrabold text-indigo-900
                     transition-all duration-500
                     group-hover:max-w-xs group-hover:ml-2">
          HireHub
        </span>
      </div>

      <!-- NAV OPTIONS (HIDDEN ON LOGIN / REGISTER) -->
      {% if show_nav_options %}
      <div class="flex items-center gap-6 text-sm font-medium text-slate-800">

        <a href="{{ home_url }}"
           class="px-2 py-1 border-b-2 border-transparent
                  hover:border-indigo-700 transition">
          Home
        </a>

        <a href="/about"
           class="px-2 py-1 border-b-2 border-transparent
                  hover:border-indigo-700 transition">
          About
        </a>

        <a href="/rate"
           class="px-2 py-1 border-b-2 border-transparent
                  hover:border-indigo-700 transition">
          Rate
        </a>

        {% if is_admin %}
        <a href="/report"
           class="px-2 py-1 border-b-2 border-transparent
                  hover:border-indigo-700 transition">
          Report
        </a>
        {% endif %}

        <a href="/settings"
           class="px-2 py-1 border-b-2 border-transparent
                  hover:border-indigo-700 transition">
          Settings
        </a>

      </div>
      {% endif %}
    </div>
  </nav>

  <!-- BACK BUTTON -->
  <div class="max-w-7xl mx-auto px-6 pt-24">
    <button onclick="history.back()"
            class="inline-flex items-center gap-2
                   px-4 py-1.5 rounded-md
                   border border-black/40
                   text-sm font-medium text-slate-900
                   hover:bg-black/10 transition">
      ← Back
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-white/20 backdrop-blur-md text-white text-center py-6">
    © 2025 HireHub · Placement Management System
  </footer>

</body>
</html>
