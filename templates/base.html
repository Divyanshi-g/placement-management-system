<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body class="min-h-screen flex flex-col text-slate-900"
      style="
        background:
          radial-gradient(at 12% 18%, rgba(220,70,120,0.85) 0px, transparent 52%), /* ROSE */
          radial-gradient(at 82% 20%, rgba(70,110,220,0.6) 0px, transparent 55%),  /* BLUE (controlled) */
          radial-gradient(at 88% 82%, rgba(220,160,40,0.85) 0px, transparent 52%), /* TURMERIC */
          radial-gradient(at 28% 75%, rgba(110,80,200,0.75) 0px, transparent 55%); /* PURPLE / INDIGO */
        background-color: #14162a;
      ">


  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50 bg-white/45 backdrop-blur-xl shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">

      <!-- LOGO -->
      <div class="group flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-full
                    bg-gradient-to-br from-purple-700 to-indigo-700
                    text-white font-bold flex items-center justify-center
                    transition-all duration-500
                    group-hover:scale-110">
          H
        </div>

        <span class="max-w-0 overflow-hidden whitespace-nowrap
                     text-2xl font-extrabold text-indigo-900
                     transition-all duration-500
                     group-hover:max-w-xs group-hover:ml-2">
          HireHub
        </span>
      </div>

      {% if show_nav_options %}
      <div class="flex items-center gap-6 text-sm font-medium text-slate-800">
        <a href="{{ home_url }}"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Home
        </a>

        <a href="/about"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          About
        </a>

        <a href="/rate"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Rate
        </a>

        {% if is_admin %}
        <a href="/report"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Report
        </a>
        {% endif %}

        <a href="/settings"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Settings
        </a>
      </div>
      {% endif %}
    </div>
  </nav>

  <!-- BACK BUTTON (TRUE LEFT) -->
  <div class="pt-15 pl-5">
    <button onclick="history.back()"
            class="inline-flex items-center gap-2
                   px-4 py-1.5 rounded-md
                   border-2 border-black/50
                   text-sm font-medium text-slate-900
                   hover:bg-black/10
                   transition-all duration-200">
      ← Back
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-white/30 backdrop-blur-md text-black text-center py-6">
  <div class="flex justify-center gap-6 mb-3 text-2xl">
    
    <a href="https://www.facebook.com"
       target="_blank"
       class="hover:text-blue-600 transition">
      <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a href="https://www.instagram.com"
       target="_blank"
       class="hover:text-pink-600 transition">
      <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="https://wa.me/91XXXXXXXXXX"
       target="_blank"
       class="hover:text-green-600 transition">
      <i class="fa-brands fa-whatsapp"></i>
    </a>

    <a href="https://www.linkedin.com"
       target="_blank"
       class="hover:text-blue-700 transition">
      <i class="fa-brands fa-linkedin-in"></i>
    </a>

  </div>

  © 2025 HireHub · Placement Management System
</footer>

</body>
</html>
