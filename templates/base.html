<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    /* Logo text reveal */
    .logo-text {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: max-width 0.4s ease, opacity 0.3s ease;
    }

    .logo-group:hover .logo-text {
      max-width: 180px;
      opacity: 1;
    }

    /* Navbar border hover effect */
    .nav-item {
      border: 2px solid transparent;
      padding: 6px 14px;
      border-radius: 9999px;
      transition: border-color 0.3s ease, color 0.3s ease;
    }

    .nav-item:hover {
      border-color: #38bdf8; /* sky blue */
      color: #0ea5e9;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col
             bg-gradient-to-br from-sky-200 via-cyan-200 to-violet-300
             text-slate-900">

  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50
              bg-white/60 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4
                flex items-center justify-between">

      <!-- LOGO -->
      <div class="logo-group flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-full
                    bg-gradient-to-br from-sky-500 to-violet-600
                    text-white font-bold text-lg
                    flex items-center justify-center
                    shadow-md">
          H
        </div>

        <span class="logo-text text-2xl font-extrabold text-sky-700">
          HireHub
        </span>
      </div>

      <!-- NAV OPTIONS -->
      <div class="flex items-center gap-4
                  text-sm font-semibold text-slate-700">
        <a href="#" class="nav-item">Home</a>
        <a href="#" class="nav-item">About</a>
        <a href="#" class="nav-item">Rate</a>
        <a href="#" class="nav-item">Settings</a>
      </div>

    </div>
  </nav>

  <!-- BACK BUTTON AREA -->
  <div class="max-w-7xl mx-auto px-6 pt-24">
    {% block back_button %}
    <!-- example back button -->
    <!--
    <a href="javascript:history.back()"
       class="inline-flex items-center gap-2
              border-2 border-sky-600
              text-sky-700
              px-4 py-2 rounded-lg
              hover:bg-sky-600 hover:text-white
              transition">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    -->
    {% endblock %}
  </div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl mx-auto px-6 py-10 w-full">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-gradient-to-r from-sky-700 to-violet-700
                 text-white">
    <div class="max-w-7xl mx-auto px-6 py-8
                flex flex-col md:flex-row
                items-center justify-between gap-6">

      <p class="text-sm text-center md:text-left">
        © 2025 HireHub · Placement Management System
      </p>

      <!-- SOCIAL ICONS -->
      <div class="flex gap-5 text-lg">
        <a href="#" class="hover:text-emerald-300 transition">
          <i class="fab fa-whatsapp"></i>
        </a>
        <a href="#" class="hover:text-blue-300 transition">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="#" class="hover:text-pink-300 transition">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="#" class="hover:text-sky-300 transition">
          <i class="fab fa-linkedin"></i>
        </a>
      </div>

    </div>
  </footer>

</body>
</html>
