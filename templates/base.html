<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>

<body class="min-h-screen flex flex-col
             bg-gradient-to-br from-slate-100 via-indigo-100 to-slate-200
             text-slate-800 transition-colors duration-300">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50
              bg-white/80 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

      <!-- Logo -->
      <div class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-full
                    bg-gradient-to-br from-indigo-600 to-blue-600
                    text-white font-bold flex items-center justify-center
                    shadow">
          H
        </div>
        <span class="text-2xl font-extrabold tracking-wide
                     text-slate-800
                     transition hover:text-indigo-700">
          HireHub
        </span>
      </div>

      <!-- Nav links -->
      <div class="flex gap-6 text-base font-medium">
        {% block nav_options %}{% endblock %}
      </div>
    </div>
  </nav>

  <!-- Optional Back Button Slot -->
  {% block back_button %}{% endblock %}

  <!-- Page Content -->
  <main class="flex-1 pt-28">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-sm text-slate-600">
    © {{ current_year }} HireHub · Placement Management System
  </footer>

</body>
</html>
