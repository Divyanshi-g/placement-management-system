
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"/>

  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .eye-icon { cursor: pointer; }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-indigo-50 text-gray-900">

<!-- ================= NAVBAR ================= -->
<nav class="fixed top-0 w-full z-50 bg-indigo-100/80 backdrop-blur-md border-b border-indigo-200">
  <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">

    <!-- Logo -->
    <div class="flex items-center gap-3 group cursor-pointer">
      <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold
                  group-hover:scale-110 transition">H</div>
      <span class="hidden md:inline text-3xl font-extrabold text-blue-600
                   group-hover:tracking-wide transition">
        HireHub
      </span>
    </div>
{% if show_nav_options %}
    <!-- Desktop Menu -->
    <div class="hidden md:flex gap-6 items-center text-blue-600 font-medium">

      <a href="{{ home_url }}" class="hover:border-b-2 border-blue-600">Home</a>
      <a href="/about">About</a>
      <a href="/rate">Rate</a>

      <!-- Settings -->
      <div class="relative">
        <button onclick="togglePanel('settingsPanel')"
                class="flex items-center gap-2">
          <i class="fa-solid fa-gear"></i> Settings
        </button>

        <div id="settingsPanel"
             class="hidden absolute right-0 mt-3 w-72 bg-indigo-200 rounded-xl shadow-xl z-50"
             onclick="event.stopPropagation()">

          <!-- Theme -->
          <div class="flex items-center justify-between px-4 py-3 border-b border-indigo-300">
            <span class="flex items-center gap-2">
              <i class="fa-solid fa-circle-half-stroke"></i> Theme
            </span>
            <input id="themeToggle" type="checkbox" onclick="toggleTheme()">
          </div>

          <!-- Change Password -->
          <button onclick="openChangePassword()"
                  class="w-full text-left px-4 py-3 hover:bg-indigo-300 flex gap-2">
            <i class="fa-solid fa-key"></i> Change Password
          </button>

          <!-- Assistant -->
          <button onclick="toggleChat()"
                  class="w-full text-left px-4 py-3 hover:bg-indigo-300 flex gap-2">
            <i class="fa-solid fa-robot"></i> HireHub Helper
          </button>

          <!-- Logout -->
          <a href="{{ url_for('enhancements.logout') }}"
             class="block px-4 py-3 hover:bg-indigo-300 flex gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </a>
        </div>
      </div>
    </div>
    <!-- Mobile Menu Button -->
    <button onclick="togglePanel('mobileMenu')" class="md:hidden text-2xl text-blue-600">
      <i class="fa-solid fa-bars"></i>
    </button>
    {% endif %}
  </div>
</nav>

<!-- ================= MOBILE MENU ================= -->
<div id="mobileMenu"
     class="hidden fixed top-16 left-0 w-full bg-indigo-100 p-4 space-y-3 z-40">
  <a href="{{ home_url }}" class="block">Home</a>
  <a href="/about" class="block">About</a>
  <a href="/rate" class="block">Rate</a>
  <button onclick="openChangePassword()" class="block">Change Password</button>
  <button onclick="toggleChat()" class="block">AI Assistant</button>
  <a href="{{ url_for('enhancements.logout') }}" class="block text-red-600">Logout</a>
</div>

{% if show_back_button %}
<div class="max-w-7xl mx-auto px-6 mt-20">
  <a href="{{ back_url }}"
     class="inline-flex items-center gap-2 text-sm
            text-blue-600 hover:text-blue-800 font-medium">
    <i class="fa-solid fa-arrow-left"></i>
    Back
  </a>
</div>
{% endif %}

<!-- ================= MAIN ================= -->
<main class="flex-1 max-w-7xl mx-auto px-6 mt-4">
  {% block content %}{% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-indigo-100 text-indigo-600 text-center py-6 border-t border-indigo-300">
  © 2026 HireHub · Placement Management System
</footer>

<!-- ================= CHANGE PASSWORD PANEL ================= -->
<div id="changePasswordPanel"
     class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center">

  <div class="bg-white w-full max-w-md rounded-2xl p-6 animate__animated animate__fadeInUp">

    <h3 class="text-xl font-bold mb-4 flex gap-2">
      <i class="fa-solid fa-key text-blue-600"></i> Change Password
    </h3>

    <!-- STEP 1: OLD PASSWORD -->
    <div id="stepOld">
      <label class="text-sm">Old Password</label>
      <div class="relative">
        <input id="oldPwd" type="password"
               class="w-full border rounded px-3 py-2 pr-10">
        <i class="fa-solid fa-eye eye-icon absolute right-3 top-2.5"
           onclick="togglePassword('oldPwd', this)"></i>
      </div>

      <button onclick="verifyOldPassword()"
              class="w-full mt-3 bg-blue-600 text-white py-2 rounded">
        Check Password
      </button>

      <button onclick="openForgot()"
              class="block text-sm text-blue-600 mt-2">
        Forgot password?
      </button>
    </div>

    <!-- STEP 2: NEW PASSWORD -->
    <div id="stepNew" class="hidden">
      <label class="text-sm">New Password</label>
      <div class="relative">
        <input id="newPwd" type="password"
               class="w-full border rounded px-3 py-2 pr-10">
        <i class="fa-solid fa-eye eye-icon absolute right-3 top-2.5"
           onclick="togglePassword('newPwd', this)"></i>
      </div>

      <label class="text-sm mt-2 block">Confirm Password</label>
      <div class="relative">
        <input id="confirmPwd" type="password"
               class="w-full border rounded px-3 py-2 pr-10">
        <i class="fa-solid fa-eye eye-icon absolute right-3 top-2.5"
           onclick="togglePassword('confirmPwd', this)"></i>
      </div>

      <button onclick="changePassword()"
              class="w-full mt-4 bg-blue-600 text-white py-2 rounded">
        Change Password
      </button>
    </div>

    <!-- STEP 3: FORGOT PASSWORD -->
    <div id="stepForgot" class="hidden">
      <label class="text-sm">Registered Email</label>
      <input id="fpEmail"
             class="w-full border rounded px-3 py-2">

      <button onclick="sendOTP()"
              class="w-full mt-3 bg-blue-600 text-white py-2 rounded">
        Send OTP
      </button>

      <div id="otpSection" class="hidden mt-3">
        <input id="otpInput"
               class="w-full border rounded px-3 py-2"
               placeholder="Enter OTP">

        <p id="otpTimer" class="text-xs mt-1 text-gray-500"></p>
        <p id="otpAttempts" class="text-xs text-red-500"></p>

        <button onclick="verifyOTP()"
                class="w-full mt-3 bg-green-600 text-white py-2 rounded">
          Confirm OTP
        </button>
      </div>
    </div>

    <button onclick="closeChangePassword()"
            class="w-full mt-4 text-gray-500">
      Close
    </button>
  </div>
</div>

<!-- ================= CHATBOT ================= -->
<div id="chatbot"
     class="hidden fixed bottom-20 right-10 w-80 bg-white rounded-xl shadow-2xl z-50 overflow-hidden">

  <div class="bg-indigo-600 text-white px-4 py-2 font-bold">
    HireHub Helper
  </div>

  <div id="chat-content" class="h-64 p-4 overflow-y-auto text-sm">
    <p class="text-gray-500">👋 Hi! Ask me about the app.</p>
  </div>

  <div class="flex border-t">
    <input id="chat-input" class="flex-1 px-3 py-2 focus:outline-none">
    <button onclick="sendMessage()" class="px-4 font-bold text-indigo-600">➤</button>
  </div>
</div>

<script>
/* ------------------------------
   PANEL TOGGLE LOGIC
--------------------------------*/
let openPanel = null;

function togglePanel(id){
  const panel = document.getElementById(id);
  if(openPanel && openPanel !== id){
    document.getElementById(openPanel)?.classList.add("hidden-panel");
  }
  panel.classList.toggle("hidden-panel");
  openPanel = panel.classList.contains("hidden-panel") ? null : id;
}

document.addEventListener("click", e=>{
  if(!openPanel) return;
  const panel = document.getElementById(openPanel);
  if(!panel.contains(e.target) && !e.target.closest("button")){
    panel.classList.add("hidden-panel");
    openPanel = null;
  }
});

/* ------------------------------
   THEME TOGGLE
--------------------------------*/
const themeSwitch = document.getElementById("themeSwitch");

function applyTheme(isDark){
  document.body.classList.toggle("bg-[#1e3a8a]", isDark);
  document.body.classList.toggle("text-white", isDark);
}

if(themeSwitch){
  applyTheme(themeSwitch.checked);
  themeSwitch.addEventListener("change",()=>{
    applyTheme(themeSwitch.checked);
    fetch("/toggle-theme",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({dark: themeSwitch.checked})
    });
  });
}

/* ------------------------------
   PASSWORD VISIBILITY (SAFE)
--------------------------------*/
function togglePassword(icon){
  if(!icon) return;

  const wrapper = icon.closest('.relative');
  if(!wrapper) return;

  const field = wrapper.querySelector('input');
  if(!field) return;

  if(field.type === "password"){
    field.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    field.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}

/* ------------------------------
   OLD PASSWORD VERIFY
--------------------------------*/
async function checkOldPassword(){
  const pwd = document.getElementById("oldPasswordInput").value;
  const err = document.getElementById("oldPasswordWarning");

  err.classList.add("hidden");

  try{
    const res = await fetch("/check-old-password",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password: pwd})
    });
    const data = await res.json();

    if(data.success){
      document.getElementById("newPasswordSection").classList.remove("hidden");
    }else{
      err.textContent = "Old password incorrect";
      err.classList.remove("hidden");
    }
  }catch{
    err.textContent = "Server error";
    err.classList.remove("hidden");
  }
}

/* ------------------------------
   UPDATE PASSWORD
--------------------------------*/
async function updatePassword(){
  const newPwd = document.getElementById("newPasswordInput").value;
  const confirmPwd = document.getElementById("confirmPasswordInput").value;
  const warn = document.getElementById("newPasswordWarning");
  const success = document.getElementById("newPasswordSuccess");

  warn.classList.add("hidden");
  success.classList.add("hidden");

  const rule = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

  if(!rule.test(newPwd)){
    warn.textContent = "Weak password";
    warn.classList.remove("hidden");
    return;
  }

  if(newPwd !== confirmPwd){
    warn.textContent = "Passwords do not match";
    warn.classList.remove("hidden");
    return;
  }

  const res = await fetch("/update-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:newPwd})
  });

  const data = await res.json();
  if(data.success){
    success.textContent = "Password updated successfully";
    success.classList.remove("hidden");
  }else{
    warn.textContent = "Update failed";
    warn.classList.remove("hidden");
  }
}

/* ------------------------------
   FORGOT PASSWORD + OTP
--------------------------------*/
let otpAttempts = 4;
let otpTimer = null;

async function sendOTP(){
  const email = document.getElementById("forgotEmail").value;
  const error = document.getElementById("forgotEmailError");

  error.classList.add("hidden");

  const res = await fetch("/send-otp",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email})
  });

  const data = await res.json();
  if(data.success){
    document.getElementById("forgotPassword").classList.add("hidden-panel");
    document.getElementById("otpStep").classList.remove("hidden-panel");
    startOTPTimer(300);
  }else{
    error.textContent = data.msg || "Email not found";
    error.classList.remove("hidden");
  }
}

function startOTPTimer(seconds){
  otpAttempts = 4;
  clearInterval(otpTimer);

  otpTimer = setInterval(()=>{
    document.getElementById("otpTimer").textContent =
      `${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`;
    document.getElementById("otpAttempts").textContent =
      `${otpAttempts} attempts left`;

    seconds--;
    if(seconds < 0) clearInterval(otpTimer);
  },1000);
}

async function verifyOTP(){
  const otp = document.getElementById("otpInput").value;
  const error = document.getElementById("otpError");

  error.classList.add("hidden");

  if(otpAttempts <= 0){
    error.textContent = "Attempts exceeded";
    error.classList.remove("hidden");
    return;
  }

  const res = await fetch("/verify-otp",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({otp})
  });

  const data = await res.json();
  if(data.success){
    document.getElementById("otpStep").classList.add("hidden-panel");
    document.getElementById("newPasswordSection").classList.remove("hidden");
    clearInterval(otpTimer);
  }else{
    otpAttempts--;
    error.textContent = "Wrong OTP";
    error.classList.remove("hidden");
  }
}

/* ------------------------------
   CHATBOT
--------------------------------*/
async function sendMessage(){
  const input = document.getElementById("chat-input");
  const content = document.getElementById("chat-content");
  if(!input.value.trim()) return;

  content.innerHTML += `<div class="text-right">🧑 ${input.value}</div>`;
  const msg = input.value;
  input.value = "";

  const res = await fetch("/app-chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  const data = await res.json();
  content.innerHTML += `<div>🤖 ${data.reply}</div>`;
}
</script>

  
</body>
</html>
