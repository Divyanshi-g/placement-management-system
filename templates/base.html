<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body class="min-h-screen flex flex-col text-slate-900"
      style="
        background:
          radial-gradient(at 10% 15%, #e45a8d 0px, transparent 55%),   /* rose */
          radial-gradient(at 85% 20%, #4f7fd6 0px, transparent 55%),   /* blue */
            radial-gradient(at 50% 50%, #f0b429 0px, transparent 60%);   /* turmeric */
          radial-gradient(at 70% 80%, #7a4bd9 0px, transparent 55%),   /* violet */
          radial-gradient(at 30% 75%, #4338ca 0px, transparent 55%),   /* purple/indigo */
          radial-gradient(at 50% 50%, #f0b429 0px, transparent 60%);   /* turmeric */
        background-color: #0c1324;
      ">


  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50 bg-white/45 backdrop-blur-xl shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">

      <!-- LOGO -->
      <div class="group flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-full
                    bg-gradient-to-br from-purple-700 to-indigo-700
                    text-white font-bold flex items-center justify-center
                    transition-all duration-500
                    group-hover:scale-110">
          H
        </div>

        <span class="max-w-0 overflow-hidden whitespace-nowrap
                     text-2xl font-extrabold text-indigo-900
                     transition-all duration-500
                     group-hover:max-w-xs group-hover:ml-2">
          HireHub
        </span>
      </div>

      {% if show_nav_options %}
      <div class="flex items-center gap-6 text-sm font-medium text-slate-800">
        <a href="{{ home_url }}"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Home
        </a>

        <a href="/about"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          About
        </a>

        <a href="/rate"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Rate
        </a>

        {% if is_admin %}
        <a href="/report"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Report
        </a>
        {% endif %}

        <a href="/settings"
           class="px-2 py-1 border-b-2 border-transparent hover:border-indigo-700 transition">
          Settings
        </a>
      </div>
      {% endif %}
    </div>
  </nav>

  <!-- BACK BUTTON (TRUE LEFT) -->
  <div class="pt-20 pl-6">
    <button onclick="history.back()"
            class="inline-flex items-center gap-2
                   px-4 py-1.5 rounded-md
                   border-2 border-black/50
                   text-sm font-medium text-slate-900
                   hover:bg-black/10
                   transition-all duration-200">
      ← Back
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-white/30 backdrop-blur-md text-black text-center py-6">
    <div class="flex justify-center gap-6 mb-3 text-xl">

      <a href="#" class="hover:text-green-600 transition">
        <i class="fab fa-whatsapp"></i>
      </a>

      <a href="#" class="hover:text-pink-600 transition">
        <i class="fab fa-instagram"></i>
      </a>

      <a href="#" class="hover:text-blue-700 transition">
        <i class="fab fa-facebook-f"></i>
      </a>

      <a href="#" class="hover:text-indigo-700 transition">
        <i class="fab fa-linkedin-in"></i>
      </a>

    </div>
    © 2025 HireHub · Placement Management System
  </footer>

</body>
</html>
