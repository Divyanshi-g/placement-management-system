<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HireHub{% endblock %}</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>

<body class="min-h-screen flex flex-col
             bg-slate-200 text-slate-100 transition-colors
             ">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50
            bg-white/70 backdrop-blur-md shadow-sm">

  <div class="max-w-7xl mx-auto px-6 py-4
              flex items-center justify-start">

  <!-- Logo circle -->
  <div
    class="w-10 h-10 rounded-full
           bg-gradient-to-br from-indigo-500 to-blue-500
           text-white font-bold flex items-center justify-center
           shadow-lg
           transition-all duration-500
           group-hover:rotate-90 group-hover:scale-90">
    H
  </div>

  <!-- Logo text -->
  <span
    class="text-3xl font-extrabold
         text-slate-900
         transition-transform transition-colors duration-300
         hover:scale-110 hover:text-slate-950"">
    HireHub
  </span>

</div>
 <!-- Nav links -->
      <div class="flex items-center gap-6 text-base font-medium text-slate-700">
        {% block nav_options %}{% endblock %}
      </div>
     
  </nav>

  <!-- Back button slot -->
  {% block back_button %}{% endblock %}

  <!-- Page content starts -->
  <main class="flex-1 pt-28">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-indigo-700 text-center py-6 text-white">
    © {{ current_year }} HireHub · Placement Management System
  </footer>

</body>
</html>
