  <script>
    let openPanel = null;

    function togglePanel(id) {
      const panel = document.getElementById(id);
      if(openPanel && openPanel !== id){
        document.getElementById(openPanel).classList.add('hidden-panel');
      }
      panel.classList.toggle('hidden-panel');
      openPanel = panel.classList.contains('hidden-panel') ? null : id;
    }

    document.addEventListener('click', function(e){
      if(!openPanel) return;
      const panel = document.getElementById(openPanel);
      if(!panel.contains(e.target) && !e.target.closest('button')){
        panel.classList.add('hidden-panel');
        openPanel = null;
      }
    });
    function openChangePassword(){
  document.getElementById("changePasswordPanel").classList.remove("hidden");
  if(openPanel){
    document.getElementById(openPanel)?.classList.add("hidden-panel");
    openPanel = null;
  }
}

  // ----------------------
  // THEME TOGGLE LOGIC
  // ----------------------
  const themeSwitch = document.getElementById('themeSwitch');

  function applyTheme(isDark){
    const body = document.body;
    
    if(isDark){
      body.classList.add('bg-[#1e3a8a]', 'text-white'); // dark navy background, white text
      body.classList.remove('bg-indigo-50', 'text-gray-900'); // remove light theme classes
      // Change all cards, panels, etc.
      document.querySelectorAll('.card, .panel').forEach(el=>{
        el.classList.add('bg-[#1f40b1]', 'text-white');
        el.classList.remove('bg-white', 'text-gray-900');
      });
    } else {
      body.classList.remove('bg-[#1e3a8a]', 'text-white');
      body.classList.add('bg-indigo-50', 'text-gray-900');
      document.querySelectorAll('.card, .panel').forEach(el=>{
        el.classList.remove('bg-[#1f40b1]', 'text-white');
        el.classList.add('bg-white', 'text-gray-900');
      });
    }
  }

  if(themeSwitch){
    // Set initial theme based on switch state
    applyTheme(themeSwitch.checked);

    themeSwitch.addEventListener('change', function(){
      applyTheme(this.checked);

      // Optional: save preference in DB or localStorage
      fetch('/toggle-theme', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({dark: this.checked})
      });
    });
  }

  // ----------------------
  // SEND OTP
  // ----------------------
  let otpCode = '';
  let otpAttempts = 4;
  let otpTimerInterval;

  function sendOTP(){
    const emailInput = document.getElementById('forgotEmailInput').value;
    const errorElem = document.getElementById('forgotEmailError');

    const registeredEmail = "{{ session.get('user_email', '') }}"; // Flask session or DB

    if(emailInput !== registeredEmail){
      errorElem.classList.remove('hidden');
      return;
    }

    errorElem.classList.add('hidden');
    otpCode = Math.floor(100000 + Math.random() * 900000).toString(); // Generate 6-digit OTP
    otpAttempts = 4;

    console.log('Generated OTP:', otpCode); // Remove in production
    alert('OTP sent to email: ' + emailInput); // Replace with real email sending

    document.getElementById('forgotPasswordStep').classList.add('hidden');
    document.getElementById('otpStepPanel').classList.remove('hidden');

    startOTPTimer(300); // 5 minutes countdown
  }

  function startOTPTimer(seconds){
    let remaining = seconds;
    const timerElem = document.getElementById('otpTimer');
    const attemptsElem = document.getElementById('otpAttempts');

    clearInterval(otpTimerInterval);

    otpTimerInterval = setInterval(() => {
      const min = Math.floor(remaining/60).toString().padStart(2,'0');
      const sec = (remaining%60).toString().padStart(2,'0');
      timerElem.textContent = `${min}:${sec}`;
      attemptsElem.textContent = `${otpAttempts} attempts left`;

      remaining--;
      if(remaining < 0){
        clearInterval(otpTimerInterval);
        document.getElementById('otpError').textContent = 'OTP expired';
        document.getElementById('otpError').classList.remove('hidden');
      }
    }, 1000);
  }

  function verifyOTP(){
    const otpInput = document.getElementById('otpInput').value;
    const errorElem = document.getElementById('otpError');

    if(otpInput === otpCode){
      errorElem.classList.add('hidden');
      document.getElementById('otpStepPanel').classList.add('hidden');
      document.getElementById('newPasswordStep').classList.remove('hidden');
      clearInterval(otpTimerInterval);
    } else {
      otpAttempts--;
      if(otpAttempts <= 0){
        errorElem.textContent = 'OTP failed 4 times';
        document.getElementById('otpError').classList.remove('hidden');
        clearInterval(otpTimerInterval);
      } else {
        errorElem.textContent = `Wrong OTP. ${otpAttempts} attempts left`;
        errorElem.classList.remove('hidden');
      }
    }
  }

  // ----------------------
  // NEW PASSWORD SUBMIT
  // ----------------------
  function submitNewPassword(){
    const newPwd = document.getElementById('newPasswordInput').value;
    const confirmPwd = document.getElementById('confirmPasswordInput').value;
    const errorElem = document.getElementById('newPasswordError');
    const successElem = document.getElementById('newPasswordSuccess');

    const pwdRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

    if(!pwdRegex.test(newPwd)){
      errorElem.textContent = "Password must be 8+ chars, 1 uppercase, 1 number, 1 special char";
      errorElem.classList.remove('hidden');
      successElem.classList.add('hidden');
      return;
    }

    if(newPwd !== confirmPwd){
      errorElem.textContent = "Passwords do not match";
      errorElem.classList.remove('hidden');
      successElem.classList.add('hidden');
      return;
    }

    // Simulate DB update with fetch/AJAX
    fetch('/update-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({new_password: newPwd})
    })
    .then(res => res.json())
    .then(data => {
      if(data.success){
        successElem.textContent = "Password changed successfully!";
        successElem.classList.remove('hidden');
        errorElem.classList.add('hidden');

        // Reset old/new password panels
        document.getElementById('oldPasswordStep').classList.remove('hidden');
        document.getElementById('newPasswordStep').classList.add('hidden');
        document.getElementById('forgotPasswordStep').classList.add('hidden');
        document.getElementById('otpStepPanel').classList.add('hidden');

      } else {
        errorElem.textContent = "Error updating password";
        errorElem.classList.remove('hidden');
        successElem.classList.add('hidden');
      }
    });
  }

async function sendMessage() {
  const input = document.getElementById("chat-input");
  const content = document.getElementById("chat-content");
  if(!input || !content) return;

  const text = input.value.trim();
  if(text === "") return;

  // User message
  const userMsg = document.createElement("div");
  userMsg.className = "text-right mb-2";
  userMsg.innerHTML = `<span class="inline-block bg-rose-100 dark:bg-rose-800 text-gray-800 dark:text-white px-3 py-2 rounded-lg">🧑 ${text}</span>`;
  content.appendChild(userMsg);

  input.value = "";
  content.scrollTop = content.scrollHeight;

  // Typing message
  const typingMsg = document.createElement("div");
  typingMsg.className = "text-left mb-2 text-sm text-gray-500 dark:text-gray-300";
  typingMsg.textContent = "🤖 typing...";
  content.appendChild(typingMsg);
  content.scrollTop = content.scrollHeight;

  try {
    const response = await fetch("/app-chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    typingMsg.remove();

    // Bot message
    const botMsg = document.createElement("div");
    botMsg.className = "text-left mb-2";
    botMsg.innerHTML = `<span class="inline-block bg-indigo-100 dark:bg-indigo-700 text-gray-800 dark:text-white px-3 py-2 rounded-lg">🤖 ${data.reply}</span>`;
    content.appendChild(botMsg);
    content.scrollTop = content.scrollHeight;

  } catch(e){
    typingMsg.remove();
    const errMsg = document.createElement("p");
    errMsg.className = "text-red-500 text-sm";
    errMsg.textContent = "🤖 Sorry, I couldn't connect right now.";
    content.appendChild(errMsg);
  }
}

let otpAttempts = 4;
let otpTimer;

async function sendOTP(){
  const email = document.getElementById("forgotEmail").value;
  const error = document.getElementById("forgotEmailError");

  error.classList.add("hidden");

  try{
    const res = await fetch("/send-otp",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email})
    });
    const data = await res.json();

    if(data.success){
      document.getElementById("forgotPassword").classList.add("hidden-panel");
      document.getElementById("otpStep").classList.remove("hidden-panel");
      startOTPTimer(300);
    }else{
      error.textContent = "Email not registered";
      error.classList.remove("hidden");
    }
  }catch(e){
    error.textContent = "Server error";
    error.classList.remove("hidden");
  }
}

function startOTPTimer(seconds){
  otpAttempts = 4;
  clearInterval(otpTimer);
  otpTimer = setInterval(()=>{
    const min = String(Math.floor(seconds/60)).padStart(2,"0");
    const sec = String(seconds%60).padStart(2,"0");
    document.getElementById("otpTimer").textContent = `${min}:${sec}`;
    document.getElementById("otpAttempts").textContent = `${otpAttempts} attempts left`;
    seconds--;
    if(seconds < 0) clearInterval(otpTimer);
  },1000);
}
    async function verifyOTP(){
  const otp = document.getElementById("otpInput").value;
  const error = document.getElementById("otpError");

  error.classList.add("hidden");

  if(otpAttempts <= 0){
    error.textContent = "OTP attempts exceeded";
    error.classList.remove("hidden");
    return;
  }

  try{
    const res = await fetch("/verify-otp",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({otp})
    });
    const data = await res.json();

    if(data.success){
      document.getElementById("otpStep").classList.add("hidden-panel");
      document.getElementById("newPasswordSection").classList.remove("hidden");
    }else{
      otpAttempts--;
      error.textContent = "Wrong OTP";
      error.classList.remove("hidden");
    }
  }catch(e){
    error.textContent = "OTP verification failed";
    error.classList.remove("hidden");
  }
}
