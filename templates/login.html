{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<!-- BACK BUTTON (just below navbar, left aligned, reduced spacing) -->
<a href="{{ url_for('enhancements.register') }}"
   class="inline-flex items-center gap-2
          text-sm font-semibold text-blue-700
          border border-blue-600
          px-3 py-1.5 rounded-lg
          bg-white
          mt-1
          transition-all duration-200
          hover:bg-blue-50 hover:scale-[1.03]">
  <i class="fa-solid fa-arrow-left"></i>
  Back
</a>

<div class="flex flex-col items-center justify-start
            min-h-[auto] md:min-h-[50vh]
            px-3 pt-2 pb-4">

  <div class="grid grid-cols-1 md:grid-cols-2
              w-full max-w-4xl
              rounded-2xl shadow-2xl
              bg-slate-50
              border-2 border-blue-200
              animate__animated animate__fadeInLeft">

    <!-- LEFT: LOGIN FORM -->
    <div class="p-8 flex flex-col justify-center bg-white">

      <h2 class="text-3xl font-extrabold mb-6 text-center text-gray-900">
        Login
      </h2>

      <form method="POST"
            action="{{ url_for('enhancements.login') }}"
            class="space-y-4">

        <!-- EMAIL -->
        <input type="email" name="email" placeholder="Email" required
               class="w-full px-4 py-3 rounded-lg
                      bg-slate-50
                      border-2 border-gray-200
                      focus:border-blue-600
                      outline-none">

        <!-- PASSWORD WITH EYE ICON -->
        <div class="relative">
          <input type="password" id="loginPassword" name="password"
                 placeholder="Password" required
                 class="w-full px-4 py-3 rounded-lg
                        bg-slate-50
                        border-2 border-gray-200
                        focus:border-blue-600
                        outline-none pr-10">

          <i class="fa-solid fa-eye absolute right-3 top-1/2 -translate-y-1/2
                    text-gray-500 cursor-pointer"
             onclick="togglePassword(this)"></i>
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit"
                class="w-full py-3 rounded-lg
                       font-semibold text-white
                       bg-blue-600 hover:bg-blue-700
                       shadow-md
                       transform transition hover:scale-[1.03]">
          Login
        </button>
      </form>

      <p class="text-sm mt-4 text-center text-gray-600">
        Don’t have an account?
        <a href="{{ url_for('enhancements.register') }}"
           class="text-blue-600 font-medium hover:underline">
          Register
        </a>
      </p>
    </div>

    <!-- RIGHT: IMAGE -->
    <div class="hidden md:flex items-center justify-center p-6
                bg-blue-50 rounded-r-2xl">
      <img src="{{ url_for('static', filename='images/login.jpg') }}"
           alt="Login Illustration"
           class="max-w-sm animate__animated animate__fadeInUp">
    </div>

  </div>
</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
  function togglePassword(icon) {
    const pwd = document.getElementById("loginPassword");
    if (pwd.type === "password") {
      pwd.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      pwd.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }
</script>

{% endblock %}
