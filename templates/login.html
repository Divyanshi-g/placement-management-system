{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="flex flex-col items-center justify-start
            min-h-[auto] md:min-h-[50vh]
            px-3 pt-2 pb-4">

  <div class="grid grid-cols-1 md:grid-cols-2
              w-full max-w-4xl
              rounded-2xl shadow-2xl
              bg-slate-50
              border-2 border-blue-200
              animate__animated animate__fadeInLeft">

    <!-- LEFT: LOGIN FORM -->
    <div class="p-8 flex flex-col justify-center bg-white">

      <h2 class="text-3xl font-extrabold mb-6 text-center text-gray-900">
        Login
      </h2>

      <form method="POST"
            action="{{ url_for('enhancements.login') }}"
            class="space-y-4">

        <!-- EMAIL -->
        <input type="email" name="email" placeholder="Email" required
               class="w-full px-4 py-3 rounded-lg
                      bg-slate-50
                      border-2 border-gray-200
                      focus:border-blue-600
                      outline-none">

        <!-- PASSWORD -->
        <div class="relative">
         <input type="logpassword"
       name="password"
         placeholder="Password"
       class="password-input w-full px-4 py-3 rounded-lg
              bg-slate-50 border-2 border-gray-200
              focus:border-blue-600 outline-none pr-12">


          <i class="fa-solid fa-eye absolute right-4 top-1/2 -translate-y-1/2
          cursor-pointer text-gray-500 hover:text-blue-600"
   onclick="togglePassword(this)"></i>

        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit"
                class="w-full py-3 rounded-lg
                       font-semibold text-white
                       bg-blue-600 hover:bg-blue-700
                       shadow-md
                       transform transition hover:scale-[1.03]">
          Login
        </button>
      </form>

      <p class="text-sm mt-4 text-center text-gray-600">
        Don’t have an account?
        <a href="{{ url_for('enhancements.register') }}"
           class="text-blue-600 font-medium hover:underline">
          Register
        </a>
      </p>
    </div>

   <!-- RIGHT: IMAGE -->
<div class="hidden lg:flex items-center justify-center p-6
            bg-blue-50 rounded-r-2xl">
  <img src="{{ url_for('static', filename='images/login.jpg') }}"
       alt="Login Illustration"
       class="max-w-sm animate__animated animate__fadeInUp">
</div>


  </div>
</div>

<script>
function togglePassword(icon){
  if(!icon) return;

  // find the closest input inside the same container
  const wrapper = icon.closest('.relative');
  if(!wrapper) return;

  const field = wrapper.querySelector('input[type="logpassword"], input[type="text"]');
  if(!field) return;

  if(field.type === "logpassword"){
    field.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    field.type = "logpassword";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}
</script>


{% endblock %}
