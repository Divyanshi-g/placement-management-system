{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="flex flex-col items-center justify-start min-h-[auto] md:min-h-[50vh] px-3 pt-2 pb-4">

  <div class="grid grid-cols-1 md:grid-cols-2 w-full max-w-4xl rounded-2xl shadow-xl
             bg-white animate__animated animate__fadeInLeft">
    
    <!-- Left: Login Form -->
    <div class="p-8 flex flex-col justify-center">
      <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>

      <form method="POST" action="{{ url_for('enhancements.login') }}" class="space-y-4">
        <input type="email" name="email" placeholder="Email" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-emerald-400 outline-none">

        <!-- Password with Eye Icon -->
        <div class="relative">
          <input type="password" name="password" id="passwordField" placeholder="Password" required
                 class="w-full px-4 py-3 rounded-lg border border-gray-300
                        focus:ring-2 focus:ring-emerald-400 outline-none pr-10">
          <i class="fa-solid fa-eye eye-icon absolute right-3 top-3 text-gray-500 cursor-pointer"
             onclick="togglePassword('passwordField', this)"></i>
        </div>

        <button type="submit" 
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700
                       text-white rounded-lg shadow-md
                       transform transition hover:scale-105">
          Login
        </button>
      </form>

      <p class="text-sm mt-4 text-center">
        Don’t have an account?
        <a href="{{ url_for('enhancements.register') }}"
           class="text-emerald-600 hover:underline">
          Register
        </a>
      </p>
    </div>

    <!-- Right: Illustration -->
    <div class="hidden md:flex items-center justify-center p-6
                bg-gradient-to-br from-emerald-500/30 to-teal-500/30
                rounded-r-2xl">
      <img src="{{ url_for('static', filename='images/login.jpg') }}"
           alt="Login Illustration"
           class="max-w-sm animate__animated animate__fadeInUp">
    </div>

  </div>
</div>

<!-- Password Toggle Script -->
<script>
  function togglePassword(fieldId, icon){
    const field = document.getElementById(fieldId);
    if(field.type === 'password'){
      field.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      field.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>

{% endblock %}
