<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | HireHub</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Animate.css -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

  <style>
    /* Modern system font (enterprise-safe, widely used) */
    body {
      font-family: ui-sans-serif, system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans",
                   "Apple Color Emoji", "Segoe UI Emoji",
                   "Segoe UI Symbol", "Noto Color Emoji";
    }

    @keyframes floatSoft {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.4rem;
        line-height: 1.2;
      }
      main {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col
             bg-slate-50 text-gray-900 transition-colors">

  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50
              bg-white/80 backdrop-blur-md border-b border-gray-200">

    <div class="max-w-7xl mx-auto px-6 py-3
                flex items-center justify-between">

      <!-- Logo -->
      <div class="flex items-center gap-3 cursor-pointer">
        <div
          class="w-10 h-10 rounded-full
                 bg-blue-600 text-white font-bold
                 flex items-center justify-center
                 shadow-sm">
          H
        </div>

        <span class="text-2xl font-extrabold text-gray-900">
          HireHub
        </span>
      </div>

      <div class="flex items-center gap-6 text-sm font-medium text-gray-600">
        <!-- intentionally empty -->
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-1 pt-24">

    <!-- SINGLE CLEAN HERO -->
    <section class="relative">
      <div class="max-w-7xl mx-auto px-8 py-20">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

          <!-- Text -->
          <div class="space-y-6 animate__animated animate__fadeInLeft">
            <h1 class="text-5xl md:text-6xl font-extrabold leading-tight text-gray-900">
              Smarter Campus Placements,<br>
              <span class="text-blue-600">
                Built for Real Outcomes
              </span>
            </h1>

            <p class="text-lg text-gray-600 max-w-lg">
              HireHub centralizes placement listings, applications,
              and student progress into one secure, structured,
              and easy-to-use system.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 pt-4">
              <a href="{{ url_for('enhancements.register') }}"
                 class="px-8 py-3 rounded-xl font-semibold
                        bg-blue-600 hover:bg-blue-700
                        text-white shadow-sm
                        transition hover:-translate-y-0.5">
                Get Started
              </a>

              <a href="{{ url_for('enhancements.login') }}"
                 class="px-8 py-3 rounded-xl font-semibold
                        bg-white border border-gray-200
                        text-gray-800 hover:bg-gray-50
                        shadow-sm transition">
                Login
              </a>
            </div>
          </div>

          <!-- Image -->
          <div class="relative flex justify-center items-center animate__animated animate__fadeInRight">
            <img src="{{ url_for('static', filename='images/placement.png') }}"
                 alt="Placement Dashboard"
                 class="w-full max-w-xl drop-shadow-xl"
                 style="animation: floatSoft 6s ease-in-out infinite;">
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-gray-200
                 text-center py-6 text-gray-600 text-sm">
    © 2026 HireHub · Placement Management System
  </footer>

</body>
</html>
