{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- Page Wrapper -->
<section class="w-full min-h-screen
                bg-gradient-to-br from-purple-100 via-purple-200 to-purple-100
                text-slate-800">

  <!-- Back Button (right side, just below navbar) -->
  <div class="max-w-7xl mx-auto px-6 pt-6 flex justify-end">
    <button onclick="history.back()"
      class="inline-flex items-center gap-2
             px-4 py-2 rounded-lg
             border border-black/60
             text-sm font-medium text-purple-800
             bg-transparent
             transition-all duration-200
             hover:bg-purple-200 hover:-translate-y-0.5">
      ← Back
    </button>
  </div>

  <!-- Register Section -->
  <div class="flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-5xl rounded-3xl shadow-2xl
                bg-white
                grid grid-cols-1 md:grid-cols-2
                overflow-hidden">

      <!-- Left: Form -->
      <div class="p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-extrabold mb-8 text-center text-purple-900">
          Create Account
        </h2>

        <form method="POST"
              action="{{ url_for('enhancements.register') }}"
              class="space-y-5">

          <input type="text" name="username" placeholder="Username" required
                 class="w-full px-4 py-3 rounded-xl
                        border border-slate-300
                        focus:ring-2 focus:ring-purple-500
                        outline-none">

          <input type="email" name="email" placeholder="Email" required
                 class="w-full px-4 py-3 rounded-xl
                        border border-slate-300
                        focus:ring-2 focus:ring-purple-500
                        outline-none">

          <input type="password" name="password" placeholder="Password" required
                 class="w-full px-4 py-3 rounded-xl
                        border border-slate-300
                        focus:ring-2 focus:ring-purple-500
                        outline-none">

          <select name="role" id="roleSelect" required
                  class="w-full px-4 py-3 rounded-xl
                         border border-slate-300
                         focus:ring-2 focus:ring-purple-500
                         outline-none">
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>

          <!-- Admin Code -->
          <div id="adminCodeField" class="hidden">
            <input type="text" name="admin_code"
                   placeholder="Admin Verification Code"
                   class="w-full px-4 py-3 rounded-xl
                          border border-slate-300
                          focus:ring-2 focus:ring-purple-600
                          outline-none">
            <p class="text-xs text-slate-600 mt-1">
              * Required only for Admin registration
            </p>
          </div>

          <button type="submit"
                  class="w-full py-3 rounded-xl font-semibold
                         bg-purple-700 hover:bg-purple-800
                         text-white shadow-lg
                         transition">
            Register
          </button>
        </form>

        <p class="text-sm mt-6 text-center text-slate-600">
          Already have an account?
          <a href="{{ url_for('enhancements.login') }}"
             class="text-purple-700 font-medium hover:underline">
            Login
          </a>
        </p>
      </div>

      <!-- Right: Illustration -->
      <div class="hidden md:flex items-center justify-center
                  bg-purple-50">
        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register Illustration"
             class="max-w-md">
      </div>

    </div>
  </div>

</section>

<!-- Admin Role Toggle -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
