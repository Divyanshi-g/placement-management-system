{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- Page Wrapper (custom background only for this page) -->
<section class="w-full min-h-screen
                bg-gradient-to-br from-rose-100 via-pink-100 to-purple-200
                flex flex-col">

  <!-- Back button (tight to navbar) -->
  <div class="max-w-6xl mx-auto px-6 pt-6">
    <button onclick="history.back()"
      class="group inline-flex items-center gap-2
             text-sm font-medium text-rose-700
             hover:text-rose-900
             transition-all duration-200">

      <span class="transform transition group-hover:-translate-x-1">←</span>
      Back
    </button>
  </div>

  <!-- Register Card -->
  <div class="flex flex-1 items-center justify-center px-6 pb-16">
    <div class="w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl
                bg-white/80 backdrop-blur-md
                grid grid-cols-1 md:grid-cols-2
                animate__animated animate__fadeInUp">

      <!-- Left: Form -->
      <div class="p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-extrabold text-slate-800 mb-6 text-center">
          Create Account
        </h2>

        <form method="POST"
              action="{{ url_for('enhancements.register') }}"
              class="space-y-4">

          <input type="text" name="username" placeholder="Username" required
                 class="w-full px-4 py-3 rounded-xl
                        border border-slate-300
                        focus:ring-2 focus:ring-rose-400
                        outline-none">

          <input type="email" name="email" placeholder="Email" required
                 class="w-full px-4 py-3 rounded-xl
                        border border-slate-300
                        focus:ring-2 focus:ring-rose-400
                        outline-none">

          <input type="password" name="password" placeholder="Password" required
                 class="w-full px-4 py-3 rounded-xl
                        border border-slate-300
                        focus:ring-2 focus:ring-rose-400
                        outline-none">

          <!-- Role -->
          <select name="role" id="roleSelect" required
                  class="w-full px-4 py-3 rounded-xl
                         border border-slate-300
                         focus:ring-2 focus:ring-rose-400
                         outline-none">
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>

          <!-- Admin Code -->
          <div id="adminCodeField" class="hidden">
            <input type="text" name="admin_code"
                   placeholder="Admin Verification Code"
                   class="w-full px-4 py-3 rounded-xl
                          border border-slate-300
                          focus:ring-2 focus:ring-indigo-400
                          outline-none">
            <p class="text-xs text-slate-600 mt-1">
              * Required only for Admin registration
            </p>
          </div>

          <button type="submit"
                  class="w-full py-3 rounded-xl font-semibold
                         bg-rose-600 hover:bg-rose-700
                         text-white shadow-lg
                         transition transform hover:-translate-y-0.5">
            Register
          </button>
        </form>

        <p class="text-sm mt-5 text-center text-slate-600">
          Already have an account?
          <a href="{{ url_for('enhancements.login') }}"
             class="text-rose-600 hover:underline font-medium">
            Login
          </a>
        </p>
      </div>

      <!-- Right: Illustration -->
      <div class="hidden md:flex items-center justify-center
                  bg-gradient-to-br from-rose-300/40 to-purple-300/40">
        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register Illustration"
             class="max-w-md drop-shadow-xl
                    animate__animated animate__fadeInRight">
      </div>

    </div>
  </div>

</section>

<!-- Admin Role Toggle -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
