{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- PAGE WRAPPER -->
<section class="min-h-screen w-full"
         style="background-color:#F4F1FB;">

  <!-- BACK BUTTON (LEFT + HIGHER) -->
  <div class="max-w-7xl mx-auto px-6 pt-3">
    <button onclick="history.back()"
      class="px-4 py-2
             border border-black
             rounded-md
             text-sm font-medium
             text-[#4A2378]
             bg-transparent
             transition-all duration-200
             hover:bg-[#E6DDF7] hover:-translate-y-0.5">
      ← Back
    </button>
  </div>

  <!-- REGISTER CARD -->
  <div class="flex justify-center items-center px-6 py-10">
    <div class="w-full max-w-5xl
                bg-white
                rounded-3xl
                shadow-2xl
                grid grid-cols-1 md:grid-cols-2
                overflow-hidden">

      <!-- LEFT FORM -->
      <div class="p-10">
        <h2 class="text-3xl font-extrabold text-center mb-8"
            style="color:#4A2378;">
          Create Account
        </h2>

        <form method="POST"
              action="{{ url_for('enhancements.register') }}"
              class="space-y-5">

          <!-- INPUT -->
          <input type="text" name="username" placeholder="Username" required
            class="w-full px-4 py-3 rounded-lg
                   border-2 border-[#2F2F2F]
                   focus:border-[#5B2D8B]
                   outline-none">

          <input type="email" name="email" placeholder="Email" required
            class="w-full px-4 py-3 rounded-lg
                   border-2 border-[#2F2F2F]
                   focus:border-[#5B2D8B]
                   outline-none">

          <input type="password" name="password" placeholder="Password" required
            class="w-full px-4 py-3 rounded-lg
                   border-2 border-[#2F2F2F]
                   focus:border-[#5B2D8B]
                   outline-none">

          <!-- ROLE -->
          <select name="role" id="roleSelect" required
            class="w-full px-4 py-3 rounded-lg
                   border-2 border-[#2F2F2F]
                   focus:border-[#5B2D8B]
                   outline-none">
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>

          <!-- ADMIN CODE -->
          <div id="adminCodeField" class="hidden">
            <input type="text" name="admin_code"
              placeholder="Admin Verification Code"
              class="w-full px-4 py-3 rounded-lg
                     border-2 border-[#2F2F2F]
                     focus:border-[#5B2D8B]
                     outline-none">
          </div>

          <!-- BUTTON -->
          <button type="submit"
            class="w-full py-3 rounded-lg
                   font-semibold text-white
                   transition-all duration-200
                   hover:scale-[1.02]"
            style="background-color:#5B2D8B;">
            Register
          </button>
        </form>

        <p class="text-sm text-center mt-6">
          Already have an account?
          <a href="{{ url_for('enhancements.login') }}"
             class="font-medium hover:underline"
             style="color:#5B2D8B;">
            Login
          </a>
        </p>
      </div>

      <!-- RIGHT IMAGE -->
      <div class="hidden md:flex items-center justify-center"
           style="background-color:#F4F1FB;">
        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register"
             class="max-w-md">
      </div>

    </div>
  </div>
</section>

<!-- SCRIPT -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
