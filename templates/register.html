{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- FULL PAGE BACKGROUND (different from home) -->
<div class="min-h-screen
            bg-gradient-to-br from-slate-100 via-indigo-100 to-purple-200
            -mt-20 pt-20">

  <!-- Back button (closer to navbar) -->
  <div class="max-w-6xl mx-auto px-6 pt-6">
    <button onclick="history.back()"
      class="group inline-flex items-center gap-2
             text-sm font-medium text-indigo-700
             hover:text-indigo-900
             transition-all duration-200">

      <span class="transform transition group-hover:-translate-x-1">←</span>
      Back
    </button>
  </div>

  <!-- REGISTER CARD -->
  <div class="flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-5xl
                rounded-3xl overflow-hidden
                bg-white
                shadow-2xl
                flex">

      <!-- LEFT: FORM -->
      <div class="w-full md:w-1/2 p-10">
        <h2 class="text-4xl font-extrabold mb-8 text-indigo-900">
          Create Account
        </h2>

        <form method="POST"
              action="{{ url_for('enhancements.register') }}"
              class="space-y-4">

          <input type="text" name="username" placeholder="Username" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none">

          <input type="email" name="email" placeholder="Email" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none">

          <input type="password" name="password" placeholder="Password" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none">

          <select name="role" id="roleSelect" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none">
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>

          <!-- ADMIN CODE -->
          <div id="adminCodeField" class="hidden">
            <input type="text" name="admin_code"
              placeholder="Admin Verification Code"
              class="w-full px-4 py-3 rounded-xl
                     border border-slate-300
                     focus:ring-2 focus:ring-purple-400
                     outline-none">
            <p class="text-xs text-slate-600 mt-1">
              * Required only for Admin registration
            </p>
          </div>

          <button type="submit"
            class="w-full py-3 rounded-xl
                   bg-indigo-600 hover:bg-indigo-700
                   text-white font-semibold
                   shadow-lg transition transform hover:-translate-y-0.5">
            Register
          </button>
        </form>

        <p class="text-sm mt-6 text-slate-600">
          Already have an account?
          <a href="{{ url_for('enhancements.login') }}"
             class="text-indigo-700 font-medium hover:underline">
            Login
          </a>
        </p>
      </div>

      <!-- RIGHT: IMAGE -->
      <div class="hidden md:flex w-1/2
                  items-center justify-center
                  bg-gradient-to-br from-indigo-200 to-purple-200">
        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register"
             class="max-w-md drop-shadow-xl">
      </div>

    </div>
  </div>
</div>

<!-- ADMIN TOGGLE -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
