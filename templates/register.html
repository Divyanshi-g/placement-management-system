{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- Page background (different from home but themed) -->
<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">

  <!-- Back button (below navbar) -->
  <div class="max-w-6xl mx-auto px-6 pt-24">
    <button onclick="history.back()"
      class="group inline-flex items-center gap-2
             px-4 py-2 rounded-xl
             text-sm font-medium text-indigo-700
             bg-transparent
             hover:bg-indigo-100/60
             transition-all duration-300">

      <span class="transform transition group-hover:-translate-x-1">←</span>
      Back
    </button>
  </div>

  <!-- Register Card -->
  <div class="flex items-center justify-center px-6 pb-16 mt-6">
    <div class="w-full max-w-5xl
                rounded-3xl overflow-hidden
                shadow-2xl
                bg-white/70 backdrop-blur-xl
                flex animate__animated animate__fadeInUp">

      <!-- Left: Form -->
      <div class="w-full md:w-1/2 p-10">
        <h2 class="text-4xl font-extrabold text-center mb-8
                   text-indigo-900">
          Create Account
        </h2>

        <form method="POST"
              action="{{ url_for('enhancements.register') }}"
              class="space-y-4">

          <input type="text" name="username" placeholder="Username" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none bg-white">

          <input type="email" name="email" placeholder="Email" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none bg-white">

          <input type="password" name="password" placeholder="Password" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none bg-white">

          <!-- Role -->
          <select name="role" id="roleSelect" required
            class="w-full px-4 py-3 rounded-xl
                   border border-slate-300
                   focus:ring-2 focus:ring-indigo-400
                   outline-none bg-white">
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>

          <!-- Admin Code -->
          <div id="adminCodeField" class="hidden">
            <input type="text" name="admin_code"
              placeholder="Admin Verification Code"
              class="w-full px-4 py-3 rounded-xl
                     border border-slate-300
                     focus:ring-2 focus:ring-purple-400
                     outline-none bg-white">
            <p class="text-xs text-slate-600 mt-1">
              * Required only for Admin registration
            </p>
          </div>

          <button type="submit"
            class="w-full py-3 rounded-xl
                   bg-gradient-to-r from-indigo-600 to-purple-600
                   hover:from-indigo-700 hover:to-purple-700
                   text-white font-semibold
                   shadow-lg transition transform hover:-translate-y-0.5">
            Register
          </button>
        </form>

        <p class="text-sm mt-6 text-center text-slate-700">
          Already have an account?
          <a href="{{ url_for('enhancements.login') }}"
             class="text-indigo-600 hover:underline font-medium">
            Login
          </a>
        </p>
      </div>

      <!-- Right: Image -->
      <div class="hidden md:flex w-1/2 items-center justify-center
                  bg-gradient-to-br from-indigo-100 to-purple-100">
        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register"
             class="max-w-md drop-shadow-xl
                    animate__animated animate__fadeInRight">
      </div>

    </div>
  </div>
</div>

<!-- Admin toggle -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
