{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}

<!-- Back Button -->
<div class="max-w-4xl mx-auto px-6 pt-24 flex justify-end">
  <button onclick="history.back()"
          class="flex items-center gap-2 text-sm font-medium text-indigo-700 hover:text-indigo-900
                 transition">
    ← Back
  </button>
</div>

<div class="flex items-center justify-center min-h-[85vh] px-6 pb-12">
  <div class="bg-gradient-to-br from-white via-purple-100 to-pink-100
              rounded-2xl shadow-2xl overflow-hidden w-full max-w-4xl flex
              animate__animated animate__fadeInUp">

    <!-- Left: Register Form -->
    <div class="p-8 flex flex-col justify-center w-full md:w-1/2">
      <h2 class="text-3xl font-bold mb-6 text-center">Create Account</h2>

      <form method="POST" action="{{ url_for('enhancements.register') }}" class="space-y-4">

        <input type="text" name="username" placeholder="Username" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-pink-400 outline-none">

        <input type="email" name="email" placeholder="Email" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-pink-400 outline-none">

        <input type="password" name="password" placeholder="Password" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-pink-400 outline-none">

        <!-- Role Selection -->
        <select name="role" id="roleSelect" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300
                       focus:ring-2 focus:ring-pink-400 outline-none">
          <option value="">Select Role</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>

        <!-- Admin Code (hidden by default) -->
        <div id="adminCodeField" class="hidden">
          <input type="text" name="admin_code" placeholder="Admin Verification Code"
                 class="w-full px-4 py-3 rounded-lg border border-gray-300
                        focus:ring-2 focus:ring-indigo-400 outline-none">
          <p class="text-xs text-gray-600 mt-1">
            * Required only for Admin registration
          </p>
        </div>

        <button type="submit"
                class="w-full py-3 bg-pink-600 hover:bg-pink-700 text-white
                       rounded-lg shadow-md transform transition hover:scale-105">
          Register
        </button>
      </form>

      <p class="text-sm mt-4 text-center">
        Already have an account?
        <a href="{{ url_for('enhancements.login') }}" class="text-pink-600 hover:underline">
          Login
        </a>
      </p>
    </div>

    <!-- Right: Illustration -->
    <div class="hidden md:flex items-center justify-center p-6
                bg-gradient-to-br from-pink-500/30 to-purple-500/30
                rounded-r-2xl w-1/2">
      <img src="{{ url_for('static', filename='images/register.jpg') }}"
           alt="Register Illustration"
           class="max-w-sm animate__animated animate__fadeInDown">
    </div>
  </div>
</div>

<!-- Admin Role Toggle Script -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle(
      "hidden",
      roleSelect.value !== "admin"
    );
  });
</script>

{% endblock %}
