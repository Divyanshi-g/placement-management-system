{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- FULL PAGE GRADIENT -->
<section class="min-h-screen w-full
                bg-gradient-to-br
                from-pink-200
                via-purple-200
                to-indigo-200">

  <!-- BACK BUTTON (MORE LEFT + HIGHER) -->
  <div class="px-4 pt-2">
    <button onclick="history.back()"
      class="px-4 py-2
             border border-white
             rounded-md
             text-sm font-medium
             text-white
             bg-transparent
             transition-all duration-200
             hover:bg-white/20">
      ← Back
    </button>
  </div>

  <!-- CARD WRAPPER -->
  <div class="flex justify-center items-center px-6 py-12">
    <div class="w-full max-w-5xl
                rounded-3xl
                shadow-2xl
                grid grid-cols-1 md:grid-cols-2
                overflow-hidden"
         style="background-color:#5B2D8B;">

      <!-- LEFT FORM -->
      <div class="p-10 text-white">
        <h2 class="text-3xl font-extrabold text-center mb-8">
          Create Account
        </h2>

        <form method="POST"
              action="{{ url_for('enhancements.register') }}"
              class="space-y-5">

          <input type="text" name="username" placeholder="Username" required
            class="w-full px-4 py-3 rounded-lg
                   bg-purple-100 text-black
                   border-2 border-transparent
                   focus:border-purple-300
                   outline-none">

          <input type="email" name="email" placeholder="Email" required
            class="w-full px-4 py-3 rounded-lg
                   bg-purple-100 text-black
                   border-2 border-transparent
                   focus:border-purple-300
                   outline-none">

          <input type="password" name="password" placeholder="Password" required
            class="w-full px-4 py-3 rounded-lg
                   bg-purple-100 text-black
                   border-2 border-transparent
                   focus:border-purple-300
                   outline-none">

          <select name="role" id="roleSelect" required
            class="w-full px-4 py-3 rounded-lg
                   bg-purple-100 text-black
                   border-2 border-transparent
                   focus:border-purple-300
                   outline-none">
            <option value="">Select Role</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>

          <div id="adminCodeField" class="hidden">
            <input type="text" name="admin_code"
              placeholder="Admin Verification Code"
              class="w-full px-4 py-3 rounded-lg
                     bg-purple-100 text-black
                     border-2 border-transparent
                     focus:border-purple-300
                     outline-none">
          </div>

          <!-- BUTTON -->
          <button type="submit"
            class="w-full py-3 rounded-lg
                   font-semibold text-white
                   transition-all duration-200
                   hover:scale-[1.03]"
            style="background-color:#3E1B66;">
            Register
          </button>
        </form>

        <p class="text-sm text-center mt-6">
          Already have an account?
          <a href="{{ url_for('enhancements.login') }}"
             class="underline font-medium">
            Login
          </a>
        </p>
      </div>

      <!-- RIGHT IMAGE -->
      <div class="hidden md:flex items-center justify-center bg-white/20">
        <img src="{{ url_for('static', filename='images/register.jpg') }}"
             alt="Register"
             class="max-w-md">
      </div>

    </div>
  </div>
</section>

<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
