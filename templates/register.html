{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<div class="flex justify-center items-center min-h-[75vh] px-6">

  <!-- GLASS CARD -->
  <div
    class="w-full max-w-5xl
           grid grid-cols-1 md:grid-cols-2
           rounded-3xl overflow-hidden
           shadow-2xl"
    style="
      background: rgba(88, 40, 120, 0.92);
      backdrop-filter: blur(14px);
    "
  >

    <!-- LEFT FORM -->
    <div class="p-10 text-white">

      <h2 class="text-3xl font-extrabold text-center mb-8">
        Create Account
      </h2>

      <form method="POST"
            action="{{ url_for('enhancements.register') }}"
            class="space-y-5">

        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-3 rounded-lg
                 bg-purple-50 text-slate-900
                 border-2 border-purple-400
                 focus:border-purple-700
                 focus:ring-2 focus:ring-purple-300
                 outline-none transition">

        <input type="email" name="email" placeholder="Email" required
          class="w-full px-4 py-3 rounded-lg
                 bg-purple-50 text-slate-900
                 border-2 border-purple-400
                 focus:border-purple-700
                 focus:ring-2 focus:ring-purple-300
                 outline-none transition">

        <input type="password" name="password" placeholder="Password" required
          class="w-full px-4 py-3 rounded-lg
                 bg-purple-50 text-slate-900
                 border-2 border-purple-400
                 focus:border-purple-700
                 focus:ring-2 focus:ring-purple-300
                 outline-none transition">

        <select name="role" id="roleSelect" required
          class="w-full px-4 py-3 rounded-lg
                 bg-purple-50 text-slate-900
                 border-2 border-purple-400
                 focus:border-purple-700
                 focus:ring-2 focus:ring-purple-300
                 outline-none transition">
          <option value="">Select Role</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>

        <div id="adminCodeField" class="hidden">
          <input type="text" name="admin_code"
            placeholder="Admin Verification Code"
            class="w-full px-4 py-3 rounded-lg
                   bg-purple-50 text-slate-900
                   border-2 border-purple-400
                   focus:border-purple-700
                   focus:ring-2 focus:ring-purple-300
                   outline-none transition">
        </div>

        <!-- BUTTON -->
        <button type="submit"
          class="w-full py-3 rounded-lg
                 font-semibold text-white
                 transition-all duration-200
                 hover:bg-purple-900"
          style="background:#3e1b66;">
          Register
        </button>
      </form>

      <p class="text-sm text-center mt-6">
        Already have an account?
        <a href="{{ url_for('enhancements.login') }}"
           class="underline font-medium">
          Login
        </a>
      </p>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="hidden md:flex items-center justify-center bg-white/10">
      <img src="{{ url_for('static', filename='images/register.jpg') }}"
           alt="Register"
           class="max-w-md opacity-90">
    </div>

  </div>
</div>

<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
