{% extends "base.html" %}
{% block title %}Register | HireHub{% endblock %}

{% block content %}

<!-- PAGE CONTENT ONLY (BASE HANDLES NAV, BACK, FOOTER) -->
<section class="min-h-screen w-full flex items-start justify-center px-5 pt-2 pb-6">

  <!-- REGISTER CARD -->
  <div class="w-full max-w-5xl
              grid grid-cols-1 md:grid-cols-2
              rounded-3xl
              shadow-2xl
              overflow-hidden
              bg-[#faf7fb]
              border-2 border-rose-400
              animate__animated animate__fadeInUp">

    <!-- LEFT FORM -->
    <div class="p-10
                bg-gradient-to-br from-[#fff0f6] to-[#fff7fb]
                relative">

      <!-- CENTER DIVIDER -->
      <div class="hidden md:block
                  absolute top-0 right-0 h-full w-[2px]
                  bg-gradient-to-b from-rose-400 via-pink-400 to-purple-400"></div>

      <h2 class="text-4xl font-extrabold text-center mb-8 text-indigo-900">
        Create Account
      </h2>

      <form method="POST"
            action="{{ url_for('enhancements.register') }}"
            class="space-y-5">

        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-3 rounded-lg
                 bg-white
                 border-2 border-purple-300
                 focus:border-rose-500
                 outline-none">

        <input type="email" name="email" placeholder="Email" required
          class="w-full px-4 py-3 rounded-lg
                 bg-white
                 border-2 border-purple-300
                 focus:border-rose-500
                 outline-none">

        <input type="password" name="password" placeholder="Password" required
          class="w-full px-4 py-3 rounded-lg
                 bg-white
                 border-2 border-purple-300
                 focus:border-rose-500
                 outline-none">

        <!-- ROLE -->
        <select name="role" id="roleSelect" required
          class="w-full px-4 py-3 rounded-lg
                 bg-white
                 border-2 border-purple-300
                 focus:border-rose-500
                 outline-none">
          <option value="">Select Role</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>

        <!-- ADMIN CODE -->
        <div id="adminCodeField" class="hidden">
          <input type="text" name="admin_code"
            placeholder="Admin Verification Code"
            class="w-full px-4 py-3 rounded-lg
                   bg-white
                   border-2 border-purple-300
                   focus:border-rose-500
                   outline-none">
        </div>

        <!-- BUTTON -->
        <button type="submit"
          class="w-full py-3 rounded-lg
                 font-semibold text-white
                 bg-rose-600
                 hover:bg-rose-700
                 transition-all duration-200
                 hover:scale-[1.02]">
          Register
        </button>
      </form>

      <p class="text-sm text-center mt-6 text-slate-700">
        Already have an account?
        <a href="{{ url_for('enhancements.login') }}"
           class="text-rose-600 font-medium hover:underline">
          Login
        </a>
      </p>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="hidden md:flex items-center justify-center
                bg-gradient-to-br from-rose-200 to-pink-200">
      <img src="{{ url_for('static', filename='images/register.jpg') }}"
           alt="Register"
           class="max-w-md animate__animated animate__fadeInRight">
    </div>

  </div>
</section>

<!-- ADMIN ROLE TOGGLE -->
<script>
  const roleSelect = document.getElementById("roleSelect");
  const adminCodeField = document.getElementById("adminCodeField");

  roleSelect.addEventListener("change", () => {
    adminCodeField.classList.toggle("hidden", roleSelect.value !== "admin");
  });
</script>

{% endblock %}
