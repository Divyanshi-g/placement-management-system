{% extends "base.html" %}
{% block title %}Profile & Resume{% endblock %}

{% block content %}

<div class="max-w-5xl mx-auto mb-10 p-8 bg-gradient-to-r from-green-400 to-teal-500 rounded-2xl shadow-2xl animate__animated animate__fadeInUp relative">

  <!-- Top Heading + Edit Button -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-3xl font-bold text-white">👤 Profile & Resume</h2>

    <button id="editBtn"
            onclick="enableEdit()"
            class="bg-white text-green-600 px-4 py-2 rounded-lg font-semibold shadow hover:scale-105 transition">
      ✏️ Edit Profile
    </button>
  </div>

  <form method="POST" enctype="multipart/form-data"
        class="space-y-6 bg-white rounded-xl p-6 shadow-lg animate__animated animate__fadeIn">

    <!-- Profile Picture -->
    <div class="flex flex-col items-center">
      <img src="{% if user.profile_pic %}{{ url_for('static', filename='uploads/profile_pics/'~ user.profile_pic) }}{% else %}  {{ url_for('static', filename='uploads/profile_pics/default-avatar.png') }}{% endif %}"
           class="w-28 h-28 rounded-full border-4 border-green-400 shadow-lg mb-2"
           style="cursor:pointer;"
           onclick="openImageModal(this.src)">

      <p class="text-gray-700 font-semibold text-center">{{ user.username }}</p>

      <!-- Editable input -->
      <input type="file" name="profile_pic" class="text-sm mt-2 hidden editableField">
    </div>

    <!-- Username + Email -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="font-semibold">Username</label>
        <input type="text" value="{{ user.username }}" disabled
               class="w-full px-4 py-2 rounded-lg border border-gray-500">
      </div>

      <div>
        <label class="font-semibold">Email</label>
        <input type="email" value="{{ user.email }}" disabled
               class="w-full px-4 py-2 rounded-lg border border-gray-500">
      </div>
    </div>

    <!-- Phone + Gender -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="font-semibold">Phone</label>
        <input type="text" name="phone" value="{{ user.phone or '' }}"
               disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div>

      <div>
        <label class="font-semibold">Gender</label>
        <input type="text" name="gender" value="{{ user.gender or '' }}"
               disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div>
    </div>

    <!-- Course + Branch -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="font-semibold">Course</label>
        <input type="text" name="course" value="{{ user.course or '' }}"
               disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div>

      <div>
        <label class="font-semibold">Branch</label>
        <input type="text" name="branch" value="{{ user.branch or '' }}"
               disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div>
    </div>

    <!-- Passing Year + CGPA -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="font-semibold">Passing Year</label>
        <input type="text" name="passing_year" value="{{ user.passing_year or '' }}"
               disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div>

      <div>
        <label class="font-semibold">CGPA / %</label>
        <input type="text" name="cgpa" value="{{ user.cgpa or '' }}"
               disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div>
    </div>

    <!-- Bio -->
    <div>
      <label class="font-semibold">Short Bio</label>
      <textarea name="bio" rows="2"
                disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">{{ user.bio or '' }}</textarea>
    </div>

    <!-- Skills -->
    <div>
      <label class="font-semibold">Skills</label>
      <textarea name="skills" rows="3"
                disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">{{ user.skills or '' }}</textarea>
    </div>

    <!-- Certifications -->
    <div>
      <label class="font-semibold">Certifications</label>
      <textarea name="certifications" rows="3"
                disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">{{ user.certifications or '' }}</textarea>
    </div>

<!-- LinkedIn + GitHub -->
    <div class="grid grid-cols-2 gap-6"> 
      <div>
        <label class="font-semibold">LinkedIn</label> 
        <input type="text" name="linkedin" value="{{ user.linkedin or '' }}" disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div> 
      <div> 
        <label class="font-semibold">GitHub</label> 
        <input type="text" name="github" value="{{ user.github or '' }}" disabled class="w-full px-4 py-2 rounded-lg border border-gray-500 editableField">
      </div> 
    </div> 
    <!-- Resume --> 
    <div> 
      <label class="font-semibold">Upload Resume</label>
      <div class="border-2 border-dashed border-gray-500 rounded-lg p-4 text-center hidden editableField"> 
        <input type="file" name="resume" class="mx-auto"> 
        <p class="text-sm text-gray-600 mt-1">PDF / DOC allowed</p>
      </div> 
      {% if user.resume %} 
      <p class="mt-2 text-sm"> 📄 Current Resume: <a href="{{ url_for('static', filename='uploads/resumes/'+user.resume) }}" class="text-green-600 underline" target="_blank"> {{ user.resume }} </a> </p>
      {% endif %}
    </div>

    <!-- Save -->
    <button id="saveBtn" type="submit"
            class="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow hidden mt-4">
      💾 Save Changes
    </button>

  </form>
</div>

<!-- IMAGE MODAL -->
<div id="imageModal"
     style="display:none; position:fixed; top:0; left:0;
            width:100%; height:100%; background:rgba(0,0,0,.8);
            justify-content:center; align-items:center; z-index:9999;">
    <img id="modalImg" style="max-width:70%; max-height:80%; border-radius:12px;">
</div>
<style>
  /* Profile pic smaller on tiny phones */
@media (max-width: 360px) {
  .profile-pic {
    width: 5rem;
    height: 5rem;
  }
}

/* Modal width */
@media (max-width: 480px) {
  #modalImg {
    max-width: 90%;
    max-height: 80%;
  }
}

/* Reduce form padding on mobile */
@media (max-width: 480px) {
  form {
    padding: 1rem;
  }
}

/* Font size for inputs + textareas */
@media (max-width: 480px) {
  input, textarea {
    font-size: 0.875rem;
  }
}
</style>
<script>
function enableEdit() {
  document.querySelectorAll(".editableField").forEach(el => {
    el.disabled = false;
    el.classList.remove("hidden");
  });
  document.getElementById("saveBtn").classList.remove("hidden");
  document.getElementById("editBtn").classList.add("hidden");
}

function openImageModal(src) {
    document.getElementById("modalImg").src = src;
    document.getElementById("imageModal").style.display = "flex";
}
document.getElementById("imageModal").onclick = function () {
    this.style.display = "none";
};
</script>

{% endblock %}
