{% extends "base.html" %}
{% block title %}Profile & Resume{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mb-10 p-8 bg-gradient-to-r from-green-400 to-teal-500 rounded-2xl shadow-2xl animate__animated animate__fadeInUp relative">

  <!-- Edit Button -->
  <button id="editBtn"
          onclick="enableEdit()"
          class="absolute top-5 right-5 bg-white text-green-600 px-4 py-2 rounded-lg font-semibold shadow hover:scale-105 transition">
    ✏️ Edit Profile
  </button>

  <h2 class="text-3xl font-bold text-center text-white mb-6">👤 Profile & Resume</h2>

  <form method="POST" enctype="multipart/form-data" class="space-y-6 bg-white rounded-xl p-6 shadow-lg">

    <!-- Profile Picture -->
    <div class="flex items-center space-x-6">
      <img src="{% if user.profile_pic %}{{ url_for('enhancements.uploaded_profile_pic', filename=user.profile_pic) }}{% else %}/static/uploads/profile_pics/default-avatar.png{% endif %}"
           alt="Profile Picture"
           class="w-24 h-24 rounded-full border shadow-lg">
      <input type="file" name="profile_pic" class="text-sm inputField hidden">
    </div>

    <!-- Row: Username + Email -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="block text-gray-700 font-semibold">Username</label>
        <input type="text" name="username" value="{{ user.username }}"
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
               disabled>
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">Email</label>
        <input type="email" name="email" value="{{ user.email }}"
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
               disabled>
      </div>
    </div>

    <!-- Row: Phone + Gender -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="block text-gray-700 font-semibold">Phone</label>
        <input type="text" name="phone" value="{{ user.phone or '' }}"
               placeholder="Enter your phone number"
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
               disabled>
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">Gender</label>
        <input type="text" name="gender" value="{{ user.gender or '' }}"
               placeholder="Male / Female / Other"
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
               disabled>
      </div>
    </div>

    <!-- Row: Course + Branch -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="block text-gray-700 font-semibold">Course</label>
        <input type="text" name="course" value="{{ user.course or '' }}"
               placeholder="B.Tech / BCA / MCA etc"
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
               disabled>
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">Branch / Specialization</label>
        <input type="text" name="branch" value="{{ user.branch or '' }}"
               placeholder="CSE / IT / AI / MBA..."
               class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
               disabled>
      </div>
    </div>

    <!-- Row: Passing Year + CGPA -->
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="block text-gray-700 font-semibold">Passing Year</label>
        <input type="text" name="passing_year" value="{{ user.passing_year or '' }}"
               class="w-full px-4 py-2 rounded-lg border inputField focus:ring-2 focus:ring-green-500"
               disabled>
      </div>

      <div>
        <label class="block text-gray-700 font-semibold">CGPA / Percentage</label>
        <input type="text" name="cgpa" value="{{ user.cgpa or '' }}"
               class="w-full px-4 py-2 rounded-lg border inputField focus:ring-2 focus:ring-green-500"
               disabled>
      </div>
    </div>

    <!-- Skills -->
    <div>
      <label class="block text-gray-700 font-semibold">Skills</label>
      <textarea name="skills" rows="3"
                class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
                disabled>{{ user.skills or '' }}</textarea>
    </div>

    <!-- Certifications -->
    <div>
      <label class="block text-gray-700 font-semibold">Certifications</label>
      <textarea name="certifications" rows="3"
                class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 inputField"
                disabled>{{ user.certifications or '' }}</textarea>
    </div>

    <!-- Resume Upload -->
    <div>
      <label class="block text-gray-700 font-semibold">Upload Resume</label>
      <input type="file" name="resume" class="w-full inputField hidden">

      {% if user.resume %}
      <p class="mt-2 text-sm">
        📄 Current Resume:
        <a href="{{ url_for('enhancements.uploaded_resume', filename=user.resume) }}"
           target="_blank"
           class="text-green-600 hover:underline">
          {{ user.resume }}
        </a>
      </p>
      {% endif %}
    </div>

    <!-- Save Button -->
    <button id="saveBtn" type="submit"
            class="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md transform hover:scale-105 transition hidden">
      💾 Save Changes
    </button>

  </form>
</div>

<!-- Script to Enable Editing -->
<script>
function enableEdit() {
  document.querySelectorAll(".inputField").forEach(el => {
    el.disabled = false;
    el.classList.remove("hidden");
  });

  document.getElementById("saveBtn").classList.remove("hidden");
  document.getElementById("editBtn").classList.add("hidden");
}
</script>

{% endblock %}
