    🎓 Courses & Video Suggestions
  </h1>
  <p class="text-gray-800 dark:text-gray-200 text-center mb-8 animate__animated animate__fadeInUp animate__delay-1s">
    Explore courses related to your degree and skillset. Click on a course to view curated high-quality video tutorials from top creators.
  </p>

  <!-- Search Box -->
  <div class="flex justify-center mb-6">
    <input type="text" id="courseSearch" placeholder="Search Course..." 
           class="px-4 py-2 rounded-l-xl border border-emerald-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:bg-gray-700 dark:text-white">
    <button id="searchBtn" 
            class="px-6 py-2 bg-emerald-600 text-white rounded-r-xl hover:bg-emerald-700 transition">Search</button>
  </div>

  <!-- Loader -->
  <div id="loader" class="hidden flex justify-center my-4">
    <svg class="animate-spin h-8 w-8 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
  </div>

  <!-- Courses Grid -->
  <div id="coursesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Course Cards will be populated here by JS -->

// Render courses
function showCourses(list) {
  const container = document.getElementById("coursesContainer");
  container.innerHTML = "";

  list.forEach(course => {
    const card = document.createElement("div");
    card.className =
      "bg-white dark:bg-gray-800 border border-emerald-300 dark:border-gray-600 rounded-xl shadow-lg p-4 cursor-pointer transition hover:shadow-2xl hover:bg-emerald-50 dark:hover:bg-emerald-700";

    card.innerHTML = `
      <h2 class="text-xl font-bold text-emerald-700 dark:text-white mb-2">
        ${course.name}
      </h2>

      <div class="videoList hidden mt-2 space-y-2">
        ${course.videos
          .map(
            v => `
          <a href="${v.link}" target="_blank"
            class="flex items-center gap-2 px-3 py-1 bg-emerald-100 dark:bg-gray-700 dark:text-white rounded-lg hover:bg-emerald-200 dark:hover:bg-emerald-600 transition">
            <span>🎥</span>
            ${v.title}
          </a>`
          )
          .join("")}
      </div>
    `;

  card.addEventListener("click", () => {
  // Close all other open video lists
  document.querySelectorAll(".videoList").forEach(list => {
    if (list !== card.querySelector(".videoList")) {
      list.classList.add("hidden");
    }
  });

  // Toggle only the clicked one
  card.querySelector(".videoList").classList.toggle("hidden");
});

    container.appendChild(card);
  });
}

// Initial load
showCourses(courses);

// Search with loader
document.getElementById("searchBtn").addEventListener("click", () => {
  const query = document.getElementById("courseSearch").value.toLowerCase();
  const loader = document.getElementById("loader");
  loader.classList.remove("hidden");

  setTimeout(() => {
    loader.classList.add("hidden");
    const filtered = courses.filter(c =>
      c.name.toLowerCase().includes(query)
    );
    showCourses(filtered.length ? filtered : courses);
  }, 700);
});
