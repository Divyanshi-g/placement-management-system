{% extends "base.html" %}
{% block content %}

<div class="max-w-5xl mx-auto py-8">

  <h2 class="text-2xl font-bold text-indigo-700 mb-6">
    🔔 Notifications
  </h2>

  {% if notifications %}
    <div class="space-y-4">
      {% for n in notifications %}
        <div
          class="backdrop-blur-xl bg-white/50 border border-white/30
                 rounded-2xl p-5 shadow-lg hover:shadow-2xl transition">

          <div class="flex justify-between items-start">
            <div>
              <p class="font-semibold text-gray-800">
                {{ n.message }}
              </p>

              {% if n.link %}
                <a href="{{ n.link }}"
                   class="text-sm text-indigo-600 font-medium hover:underline mt-1 inline-block">
                  View →
                </a>
              {% endif %}
            </div>

            <span class="text-xs text-gray-500">
              {{ n.created_at }}
            </span>
          </div>

        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-gray-500 text-center mt-12">
      No notifications yet ✨
    </p>
  {% endif %}

</div>

{% endblock %}
