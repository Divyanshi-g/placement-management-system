{% extends "base.html" %}
{% block title %}Students Profile{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-3">Students Profile</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th style="width:140px;">Action</th>
            </tr>
        </thead>

        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.email }}</td>
                <td>{{ s.phone if s.phone else "Not Added" }}</td>

                <td>
                    <a href="{{ url_for('enhancements.view_students', user_id=s.id) }}"
                       class="btn btn-primary btn-sm">
                        View Details
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>
</div>

{% endblock %}
