{% extends "base.html" %}

{% block title %}Apply{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 pb-10">

  <h2 class="text-3xl font-bold mb-8 text-center">
    📝 Application Form – {{ placement.company }} ({{ placement.role }})
  </h2>

  <div class="bg-white rounded-xl shadow-lg p-8">

    <form method="POST" enctype="multipart/form-data">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Course -->
        <div>
          <label class="font-medium">🎓 Course</label>
          <input type="text" name="course" required
            class="w-full mt-2 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-600">
        </div>

        <!-- Skills -->
        <div>
          <label class="font-medium">🛠 Skills</label>
          <input type="text" name="skills"
            placeholder="Python, SQL, React"
            class="w-full mt-2 px-4 py-2 border rounded-lg">
        </div>

      </div>

      <!-- Experience -->
      <div class="mt-6">
        <label class="font-medium">💼 Experience (if any)</label>
        <textarea name="experience" rows="3"
          class="w-full mt-2 px-4 py-2 border rounded-lg"></textarea>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="mt-8 w-full py-3 bg-indigo-600 text-white rounded-lg text-lg hover:bg-indigo-700 transition">
        🚀 Submit Application
      </button>

    </form>
  </div>

</div>
{% endblock %}
