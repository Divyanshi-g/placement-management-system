{% extends "base.html" %}

{% block title %}Chat with Assistant{% endblock %}

{% block content %}
<style>
/* ================= MAIN CHAT CARD ================= */
.chat-card {
  max-width: 900px;
  margin: auto;
  background: linear-gradient(135deg, #ecfeff, #d1fae5);
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

/* ================= CHAT WINDOW ================= */
#chat-window {
  background: #f9fafb;
  border-radius: 16px;
  padding: 16px;
  height: 420px;
  overflow-y: auto;
}

/* Message bubbles */
.chat-user {
  background: #dbeafe;
  padding: 10px 14px;
  border-radius: 12px;
  margin-bottom: 8px;
  max-width: 80%;
}

.chat-bot {
  background: #dcfce7;
  padding: 10px 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  max-width: 80%;
}

/* ================= DRAWER ================= */
.history-drawer {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100%;
  background: #ffffff;
  box-shadow: -3px 0 10px rgba(0,0,0,0.2);
  transition: 0.4s;
  padding: 15px;
  z-index: 999;
  overflow-y: auto;
}
.history-open { right: 0; }

/* Drawer button */
.drawer-btn {
  position: fixed;
  right: 14px;
  top: 35%;
  background: #2563eb;
  color: white;
  padding: 14px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  z-index: 1000;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
}

/* ================= MOBILE FIX ================= */
@media (max-width: 768px) {

  .chat-card {
    padding: 14px !important;
    border-radius: 14px;
  }

  #chat-window {
    height: 320px;
  }

  .drawer-btn {
    right: 10px;
    top: auto;
    bottom: 20px;
  }

  .history-drawer {
    width: 100%;
  }
}
</style>

</style>

<div class="max-w-4xl mx-auto mb-15 p-6 bg-emerald-100 rounded-2xl shadow-2xl chat-card">
  <h1 class="text-4xl font-extrabold text-center mb-8 text-gray-800">
    ❓ Ask Your Questions
  </h1>

  <!-- Chat Window -->
  <div id="chat-window" class="bg-gray-50 rounded-xl shadow-inner p-6 h-[400px] overflow-y-auto mb-6">
    <p class="text-gray-400 text-center">💬 Start asking your questions...</p>
  </div>

  <!-- Input Bar -->
  <div class="flex">
    <input id="chat-input" type="text" placeholder="Type your question..."
      class="flex-1 px-4 py-3 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-400 shadow-sm">
    <button onclick="sendChat()" 
      class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-r-lg hover:scale-105 transition">
      Ask
    </button>
  </div>
</div>

<!-- Drawer Button -->
<div class="drawer-btn" onclick="toggleDrawer()">📜</div>

<!-- History Drawer -->
<div id="historyDrawer" class="history-drawer">
  <h2 class="font-bold text-xl mb-3">Chat History</h2>
  <div id="historyContent">Loading...</div>
</div>

<script>
/* ---------------- Send on Enter ---------------- */
document.getElementById("chat-input")
  .addEventListener("keypress", function(e){
    if(e.key === "Enter") sendChat();
});

/* ---------------- Toggle History Drawer ---------------- */
function toggleDrawer() {
  document.getElementById("historyDrawer").classList.toggle("history-open");
  loadHistory();
}

/* ---------------- Send Chat Message ---------------- */
async function sendChat() {
  const input = document.getElementById("chat-input");
  const msg = input.value.trim();
  if (!msg) return;

  const win = document.getElementById("chat-window");
  win.innerHTML += `<div class="mb-2"><b class="text-blue-700">You:</b> ${msg}</div>`;
  input.value = "";
  win.scrollTop = win.scrollHeight;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: msg})
    });
    const data = await res.json();

    win.innerHTML += `<div class="mb-2"><b class="text-green-700">Bot:</b> ${data.answer}</div>`;
    win.scrollTop = win.scrollHeight;

    loadHistory();
  } catch (err) {
    win.innerHTML += `<div class="text-red-500">⚠️ Error connecting to server.</div>`;
    win.scrollTop = win.scrollHeight;
  }
}

/* ---------------- Load Chat History ---------------- */
async function loadHistory() {
  const box = document.getElementById("historyContent");
  try {
    const res = await fetch("/chat/history");
    const data = await res.json();

    box.innerHTML = "";
    for (let group in data) {
      box.innerHTML += `<h3 class="font-semibold mt-2">${group}</h3>`;
      data[group].forEach(item => {
        box.innerHTML += `<div class="history-item" onclick="loadConversation(${item.id})">${item.message}</div>`;
      });
    }
  } catch(e) {
    box.innerHTML = "⚠️ Cannot load history.";
  }
}

/* ---------------- Load Single Conversation ---------------- */
async function loadConversation(id) {
  const win = document.getElementById("chat-window");
  win.innerHTML = "Loading conversation...";
  try {
    const res = await fetch(`/chat/history/${id}`);
    const data = await res.json();
    win.innerHTML = `<div class="mb-2"><b class="text-blue-700">You:</b> ${data.message}</div>`;
    win.innerHTML += `<div class="mb-2"><b class="text-green-700">Bot:</b> ${data.answer}</div>`;
    win.scrollTop = win.scrollHeight;
  } catch(e) {
    win.innerHTML = "⚠️ Cannot load conversation.";
  }
}
</script>
{% endblock %}
