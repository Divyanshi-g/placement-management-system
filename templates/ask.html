{% extends "base.html" %}
{% block title %}Chat with Assistant{% endblock %}

{% block content %}
<style>
.chat-card {
  max-width: 880px;
  margin: auto;
  background: linear-gradient(135deg, #ecfeff, #d1fae5);
  border-radius: 18px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  padding: 24px;
}

#chat-window {
  background: #f9fafb;
  border-radius: 14px;
  padding: 14px;
  height: 320px;
  overflow-y: auto;
}

.chat-user {
  background: #dbeafe;
  padding: 10px 14px;
  border-radius: 12px;
  margin-bottom: 6px;
  max-width: 80%;
}

.chat-bot {
  background: #dcfce7;
  padding: 10px 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  max-width: 80%;
}

.history-drawer {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100%;
  background: #ffffff;
  box-shadow: -3px 0 10px rgba(0,0,0,0.2);
  transition: right 0.35s ease;
  padding: 16px;
  z-index: 999;
  overflow-y: auto;
}
.history-open { right: 0; }

.drawer-btn {
  position: fixed;
  right: 14px;
  top: 40%;
  background: #2563eb;
  color: white;
  padding: 14px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  z-index: 1000;
}
.history-item {
  padding: 8px;
  background: #f3f4f6;
  margin: 6px 0;
  border-radius: 8px;
  cursor: pointer;
}
.history-item:hover { background: #e0e7ff; }
</style>

<div class="chat-card mt-6 mb-10">
  <h1 class="text-3xl font-extrabold text-center mb-6">❓ Ask Your Questions</h1>

  <div id="chat-window">
    <p class="text-gray-400 text-center">💬 Start asking your questions...</p>
  </div>

  <div class="flex gap-2 mt-4">
    <input id="chat-input" type="text"
           placeholder="Type your question..."
           class="flex-1 px-4 py-3 border rounded-lg">

    <button type="button"
            onclick="sendChat()"
            class="px-6 py-3 bg-blue-600 text-white rounded-lg">
      Ask
    </button>

    <button type="button"
            onclick="newChat()"
            class="px-4 py-3 bg-green-600 text-white rounded-lg">
      + New Chat
    </button>
  </div>
</div>

<div class="drawer-btn" onclick="toggleDrawer()">📜</div>

<div id="historyDrawer" class="history-drawer">
  <h2 class="font-bold text-xl mb-3">Chat History</h2>
  <div id="historyContent">Loading...</div>
</div>

<script>
function toggleDrawer() {
  document.getElementById("historyDrawer")
          .classList.toggle("history-open");
  loadHistory();
}

function newChat() {
  document.getElementById("chat-window").innerHTML =
    `<p class="text-gray-400 text-center">💬 Start your new chat...</p>`;
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const msg = input.value.trim();
  if (!msg) return;

  const win = document.getElementById("chat-window");

  win.innerHTML += `<div class="chat-user"><b>You:</b> ${msg}</div>`;
  input.value = "";

  const loadingId = "loading-" + Date.now();
  win.innerHTML += `<div id="${loadingId}" class="chat-bot">Bot: typing...</div>`;
  win.scrollTop = win.scrollHeight;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: msg})
    });

    const data = await res.json();
    document.getElementById(loadingId).innerHTML =
      `<b>Bot:</b> ${data.answer}`;
  } catch {
    document.getElementById(loadingId).innerHTML =
      "⚠️ Server error";
  }
}

async function loadHistory() {
  const box = document.getElementById("historyContent");
  box.innerHTML = "";

  try {
    const res = await fetch("/chat/history");
    const data = await res.json();
    (data["Your Chats"] || []).forEach(c => {
      box.innerHTML +=
        `<div class="history-item"
              onclick="loadConversation(${c.id})">${c.message}</div>`;
    });
  } catch {
    box.innerHTML = "⚠️ Cannot load history";
  }
}

async function loadConversation(id) {
  const win = document.getElementById("chat-window");
  win.innerHTML = "Loading...";

  const res = await fetch(`/chat/history/${id}`);
  const data = await res.json();

  win.innerHTML = `
    <div class="chat-user"><b>You:</b> ${data.message}</div>
    <div class="chat-bot"><b>Bot:</b> ${data.answer}</div>`;
}

document.getElementById("chat-input")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendChat();
    }
  });
</script>
{% endblock %}
