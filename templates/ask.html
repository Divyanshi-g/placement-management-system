{% extends "base.html" %}

{% block title %}Chat with Assistant{% endblock %}

{% block content %}
<style>
/* ================= MAIN CHAT CARD ================= */
.chat-card {
  max-width: 880px;
  margin: auto;
  background: linear-gradient(135deg, #ecfeff, #d1fae5);
  border-radius: 18px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  padding: 24px;
}

/* ================= CHAT WINDOW ================= */
#chat-window {
  background: #f9fafb;
  border-radius: 14px;
  padding: 14px;
  height: 320px;
  overflow-y: auto;
}

/* Message bubbles */
.chat-user {
  background: #dbeafe;
  padding: 10px 14px;
  border-radius: 12px;
  margin-bottom: 6px;
  max-width: 80%;
}

.chat-bot {
  background: #dcfce7;
  padding: 10px 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  max-width: 80%;
}

/* ================= DRAWER ================= */
.history-drawer {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100%;
  background: #ffffff;
  box-shadow: -3px 0 10px rgba(0,0,0,0.2);
  transition: right 0.35s ease;
  padding: 16px;
  z-index: 999;
  overflow-y: auto;
}
.history-open { right: 0; }

/* Drawer button */
.drawer-btn {
  position: fixed;
  right: 14px;
  top: 40%;
  background: #2563eb;
  color: white;
  padding: 14px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  z-index: 1000;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
}

/* History items */
.history-item {
  padding: 8px;
  background: #f3f4f6;
  margin: 6px 0;
  border-radius: 8px;
  cursor: pointer;
}
.history-item:hover { background: #e0e7ff; }

/* ================= MOBILE FIX ================= */
@media (max-width: 768px) {
  .chat-card {
    padding: 16px;
    border-radius: 14px;
  }

  #chat-window {
    height: 260px;
  }

  .drawer-btn {
    right: 10px;
    top: auto;
    bottom: 20px;
  }

  .history-drawer {
    width: 100%;
  }
}
</style>

<div class="chat-card mt-6 mb-10">
  <h1 class="text-3xl md:text-4xl font-extrabold text-center mb-6 text-gray-800">
    ❓ Ask Your Questions
  </h1>

  <!-- Chat Window -->
  <div id="chat-window">
    <p class="text-gray-400 text-center">💬 Start asking your questions...</p>
  </div>

  <!-- Input Bar -->
  <div class="flex mt-4">
    <input id="chat-input" type="text" placeholder="Type your question..."
      class="flex-1 px-4 py-3 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-400">
    <button onclick="sendChat()"
      class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-r-lg hover:scale-105 transition">
      Ask
    </button>
    <button onclick="newChat()"
      class="ml-2 px-4 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition">
      🆕 New Chat
    </button>
  </div>
</div>

<!-- Drawer Button -->
<div class="drawer-btn" onclick="toggleDrawer()">📜</div>

<!-- History Drawer -->
<div id="historyDrawer" class="history-drawer">
  <h2 class="font-bold text-xl mb-3">Chat History</h2>
  <div id="historyContent">Loading...</div>
</div>

<script>
let currentConversationId = null;

/* ================= TOGGLE DRAWER ================= */
function toggleDrawer() {
  const drawer = document.getElementById("historyDrawer");
  drawer.classList.toggle("history-open");
  loadHistory();
}

/* ================= NEW CHAT ================= */
function newChat() {
  currentConversationId = null;
  const win = document.getElementById("chat-window");
  win.innerHTML = `<p class="text-gray-400 text-center">💬 Start your new chat...</p>`;
}

/* ================= SEND CHAT ================= */
async function sendChat() {
  const input = document.getElementById("chat-input");
  const msg = input.value.trim();
  if (!msg) return;

  const win = document.getElementById("chat-window");
  win.innerHTML += `<div class="chat-user"><b>You:</b> ${msg}</div>`;
  input.value = "";
  win.scrollTop = win.scrollHeight;

  const loadingId = "loading-" + Date.now();
  win.innerHTML += `<div id="${loadingId}" class="chat-bot text-gray-500"><b>Bot:</b> typing...</div>`;
  win.scrollTop = win.scrollHeight;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: msg, conversation_id: currentConversationId })
    });
    const data = await res.json();

    document.getElementById(loadingId).innerHTML = `<b>Bot:</b> ${data.answer}`;
    currentConversationId = data.conversation_id;

  } catch (err) {
    document.getElementById(loadingId).innerHTML = `<b>Bot:</b> ⚠️ Server error.`;
  }

  win.scrollTop = win.scrollHeight;
}

/* ================= LOAD HISTORY ================= */
async function loadHistory() {
  const box = document.getElementById("historyContent");
  try {
    const res = await fetch("/chat/history");
    const data = await res.json();

    box.innerHTML = "";
    for (let conv of data) {
      box.innerHTML += `
        <div class="history-item"
             onclick="loadConversation('${conv.conversation_id}')">
          ${conv.preview}
        </div>`;
    }
  } catch (e) {
    box.innerHTML = "⚠️ Cannot load history.";
  }
}

/* ================= LOAD SINGLE CHAT ================= */
async function loadConversation(conversationId) {
  currentConversationId = conversationId;
  const win = document.getElementById("chat-window");
  win.innerHTML = "Loading conversation...";

  try {
    const res = await fetch(`/chat/history/${conversationId}`);
    const data = await res.json();

    win.innerHTML = "";
    for (let msg of data) {
      const cls = msg.role === "user" ? "chat-user" : "chat-bot";
      win.innerHTML += `<div class="${cls}"><b>${msg.role === "user" ? 'You' : 'Bot'}:</b> ${msg.content}</div>`;
    }
    win.scrollTop = win.scrollHeight;

  } catch {
    win.innerHTML = "⚠️ Cannot load conversation.";
  }
}
</script>
{% endblock %}
